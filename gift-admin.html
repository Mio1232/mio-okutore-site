<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プレゼント管理 — mio億トレ</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F2EA; --bg-soft:#EFE7DA; --bg-card:#FFFEFB; --ink:#3A2E2A; --ink-mid:#6B5D57; --ink-soft:#998B83;
  --rose:#C98B95; --rose-soft:#E8D0D2; --rose-deep:#B06B75; --sage:#9BB59C; --sage-soft:#C9DACA; --honey:#D4B677;
  --line:rgba(58,46,42,0.08); --line-strong:rgba(58,46,42,0.14);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',sans-serif;line-height:1.6;}
.app{max-width:560px;margin:0 auto;padding:0 0 60px;}
.page-header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:14px 18px;background:rgba(247,242,234,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
.brand{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--rose-deep);text-decoration:none;}
.page-title{font-family:'Noto Serif JP',serif;font-weight:700;font-size:15px;}
.section{margin:16px;padding:18px;background:var(--bg-card);border:1px solid var(--line);border-radius:16px;}
.section h2{font-family:'Noto Serif JP',serif;font-size:15px;font-weight:700;margin-bottom:12px;}
label{display:block;font-size:12px;color:var(--ink-mid);margin:10px 0 4px;}
input[type=text],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink);}
textarea{min-height:120px;resize:vertical;line-height:1.7;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border:none;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}
.btn-primary{background:var(--rose-deep);color:#fff;}
.btn-sage{background:var(--sage);color:#fff;}
.btn-ghost{background:var(--bg-soft);color:var(--ink-mid);border:1px solid var(--line-strong);}
.btn:disabled{opacity:.55;cursor:default;}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.preview{margin-top:12px;padding:14px;background:var(--bg-soft);border:1px solid var(--line);border-radius:12px;}
.preview h3{font-family:'Noto Serif JP',serif;font-size:15px;margin:12px 0 6px;color:var(--rose-deep);}
.preview p{font-size:14px;margin:6px 0;}
.preview ul{margin:6px 0 6px 18px;font-size:14px;}
.preview table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px;}
.preview th,.preview td{border:1px solid var(--line-strong);padding:6px 8px;text-align:left;}
.preview th{background:var(--rose-soft);}
.item{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:8px;}
.item-main{flex:1;min-width:0;}
.item-title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-meta{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;}
.badge.published{background:var(--sage-soft);color:#4a6b4c;}
.badge.draft{background:var(--bg-soft);color:var(--ink-soft);}
.mini{padding:6px 9px;font-size:12px;border-radius:8px;border:1px solid var(--line-strong);background:#fff;color:var(--ink-mid);cursor:pointer;}
.note{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.7;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .25s;z-index:50;}
.toast.show{opacity:1;}
.deny{margin:40px 16px;text-align:center;color:var(--ink-mid);}
</style>
</head>
<body>
<div class="app">
  <header class="page-header">
    <a class="brand" href="dashboard.html">← mio okutore</a>
    <div class="page-title">🎁 プレゼント管理</div>
  </header>
  <div id="content"></div>
</div>

<div class="toast" id="toast"></div>

<template id="adminTemplate">
  <!-- キーワード設定 -->
  <div class="section">
    <h2>解除キーワード（LINEで配布）</h2>
    <label>現在のキーワード（このキーワードを入力した人が閲覧できます）</label>
    <input type="text" id="keywordInput" placeholder="例：okutore0613">
    <div class="row">
      <button class="btn btn-primary" id="saveKeywordBtn">キーワードを保存</button>
    </div>
    <p class="note">LINEの自動応答などでこのキーワードを配布してください。変更すると、新しいキーワードを入力した人だけが解除できるようになります（すでに解除済みの人はそのまま見られます）。</p>
  </div>

  <!-- 生成 -->
  <div class="section">
    <h2>記事を生成</h2>
    <label>テーマ</label>
    <select id="focusSelect">
      <option value="both">ドル円＋ゴールド</option>
      <option value="usdjpy">ドル円のみ</option>
      <option value="gold">ゴールドのみ</option>
    </select>
    <div class="row">
      <button class="btn btn-primary" id="generateBtn">🪄 最新ニュースから生成</button>
    </div>
    <p class="note">最新のニュースをWeb検索で読み込み、mio口調の記事＋シナリオ表を自動生成します。生成は裏側で実行され、30秒〜1分ほどで完成した下書きがこの画面に読み込まれます（待っている間も画面を閉じなければOK）。内容を確認・編集してから公開してください。</p>
  </div>

  <!-- 編集・プレビュー -->
  <div class="section">
    <h2>内容の確認・編集</h2>
    <label>タイトル</label>
    <input type="text" id="titleInput" placeholder="記事タイトル">
    <label>本文（HTML）</label>
    <textarea id="bodyInput" placeholder="生成するとここに入ります"></textarea>
    <label>シナリオ表（HTML・任意）</label>
    <textarea id="tableInput" placeholder="&lt;table&gt;...&lt;/table&gt;"></textarea>
    <div class="row">
      <button class="btn btn-ghost" id="previewBtn">プレビュー更新</button>
      <button class="btn btn-ghost" id="draftBtn">下書き保存</button>
      <button class="btn btn-sage" id="publishBtn">公開する</button>
    </div>
    <div class="preview" id="preview"><p class="note">プレビューがここに表示されます。</p></div>
  </div>

  <!-- 一覧 -->
  <div class="section">
    <h2>記事一覧</h2>
    <div id="list"><p class="note">読み込み中…</p></div>
  </div>
</template>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const supabase = createClient(
  'https://iupkaxzesrximmfkipzd.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1cGtheHplc3J4aW1tZmtpcHpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4MDM1NjIsImV4cCI6MjA5NDM3OTU2Mn0.jDZOxyLkSd3NcZgIKHJGOK9m8D561eqoQYbOUxtFYOQ'
);
const content = document.getElementById('content');
const toastEl = document.getElementById('toast');
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'), 2200); }

const { data: { session } } = await supabase.auth.getSession();
if (!session) { location.href = 'login.html'; }
else {
  const user = session.user;
  const { data: prof } = await supabase.from('profiles').select('is_admin').eq('id', user.id).single();
  if (!prof || prof.is_admin !== true) {
    content.innerHTML = '<div class="deny">このページは管理者専用です🌸<br><br><a class="brand" href="dashboard.html">← マイページへ戻る</a></div>';
  } else {
    content.appendChild(document.getElementById('adminTemplate').content.cloneNode(true));

    const keywordInput = document.getElementById('keywordInput');
    const titleInput = document.getElementById('titleInput');
    const bodyInput = document.getElementById('bodyInput');
    const tableInput = document.getElementById('tableInput');
    const focusSelect = document.getElementById('focusSelect');
    const preview = document.getElementById('preview');
    const listEl = document.getElementById('list');
    let currentEditId = null;

    function renderPreview(){
      preview.innerHTML = (bodyInput.value || '') + (tableInput.value || '');
      if (!preview.innerHTML.trim()) preview.innerHTML = '<p class="note">プレビューがここに表示されます。</p>';
    }

    // ===== キーワード =====
    async function loadKeyword(){
      const { data } = await supabase.from('gift_settings').select('unlock_keyword').eq('id',1).single();
      if (data) keywordInput.value = data.unlock_keyword || '';
    }
    document.getElementById('saveKeywordBtn').onclick = async ()=>{
      const kw = keywordInput.value.trim();
      const { error } = await supabase.from('gift_settings').update({ unlock_keyword: kw, updated_at: new Date().toISOString() }).eq('id',1);
      toast(error ? '保存に失敗しました' : 'キーワードを保存しました🌸');
    };

    // ===== 生成（バックグラウンド関数＋ポーリング）=====
    document.getElementById('generateBtn').onclick = async (e)=>{
      const btn = e.currentTarget;
      btn.disabled = true; const old = btn.textContent; btn.textContent = '生成中…（最大1分ほど）';
      try {
        // 生成前に既存の下書きIDを控える
        const { data: before } = await supabase.from('gift_contents').select('id').eq('status','draft');
        const beforeIds = new Set((before || []).map(r=>r.id));
        // バックグラウンド生成を起動（即座に202が返る＝504にならない）
        await fetch('/.netlify/functions/gift-generate-background', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ user_id: user.id, focus: focusSelect.value })
        });
        // 新しい下書きが現れるまでポーリング（5秒ごと・最大24回＝2分）
        let found = null;
        for (let i=0; i<24 && !found; i++){
          await new Promise(r=>setTimeout(r, 5000));
          const { data: now } = await supabase.from('gift_contents')
            .select('id,title,body_html,table_html')
            .eq('status','draft').order('created_at',{ascending:false}).limit(5);
          found = (now || []).find(r=>!beforeIds.has(r.id));
        }
        if (found){
          currentEditId = found.id; // 既に下書き保存済みの行を編集対象にする
          titleInput.value = found.title || '';
          bodyInput.value = found.body_html || '';
          tableInput.value = found.table_html || '';
          renderPreview();
          loadList();
          toast('生成しました。内容を確認してください🌸');
        } else {
          toast('まだ生成中かもしれません。少し待って一覧をご確認ください');
          loadList();
        }
      } catch (err) {
        toast('生成の起動に失敗しました');
      } finally {
        btn.disabled = false; btn.textContent = old;
      }
    };

    document.getElementById('previewBtn').onclick = renderPreview;

    // ===== 保存・公開 =====
    async function savePost(status){
      const title = titleInput.value.trim();
      if (!title){ toast('タイトルを入力してください'); return; }
      const payload = { title, body_html: bodyInput.value, table_html: tableInput.value, status };
      if (status === 'published') payload.published_at = new Date().toISOString();
      let error;
      if (currentEditId){
        ({ error } = await supabase.from('gift_contents').update(payload).eq('id', currentEditId));
      } else {
        const ins = await supabase.from('gift_contents').insert(payload).select('id').single();
        error = ins.error; if (!error) currentEditId = ins.data.id;
      }
      if (error){ toast('保存に失敗しました'); return; }
      toast(status === 'published' ? '公開しました🎁' : '下書き保存しました');
      loadList();
    }
    document.getElementById('draftBtn').onclick = ()=>savePost('draft');
    document.getElementById('publishBtn').onclick = ()=>savePost('published');

    // ===== 一覧 =====
    async function loadList(){
      const { data, error } = await supabase.from('gift_contents')
        .select('id,title,status,created_at,published_at').order('created_at',{ascending:false}).limit(30);
      if (error){ listEl.innerHTML = '<p class="note">読み込みに失敗しました</p>'; return; }
      if (!data || !data.length){ listEl.innerHTML = '<p class="note">まだ記事がありません</p>'; return; }
      listEl.innerHTML = '';
      data.forEach(row=>{
        const d = new Date(row.created_at);
        const item = document.createElement('div'); item.className='item';
        item.innerHTML =
          '<div class="item-main"><div class="item-title"></div><div class="item-meta">'+(d.getMonth()+1)+'/'+d.getDate()+'</div></div>'+
          '<span class="badge '+(row.status)+'">'+(row.status==='published'?'公開中':'下書き')+'</span>'+
          '<button class="mini" data-act="edit">編集</button>'+
          '<button class="mini" data-act="toggle">'+(row.status==='published'?'非公開':'公開')+'</button>'+
          '<button class="mini" data-act="del">削除</button>';
        item.querySelector('.item-title').textContent = row.title;
        item.querySelector('[data-act=edit]').onclick = ()=>editPost(row.id);
        item.querySelector('[data-act=toggle]').onclick = ()=>togglePublish(row.id, row.status);
        item.querySelector('[data-act=del]').onclick = ()=>delPost(row.id);
        listEl.appendChild(item);
      });
    }
    async function editPost(id){
      const { data } = await supabase.from('gift_contents').select('*').eq('id', id).single();
      if (!data) return;
      currentEditId = id;
      titleInput.value = data.title || '';
      bodyInput.value = data.body_html || '';
      tableInput.value = data.table_html || '';
      renderPreview();
      window.scrollTo({ top:0, behavior:'smooth' });
      toast('編集モードにしました');
    }
    async function togglePublish(id, status){
      const next = status === 'published' ? 'draft' : 'published';
      const patch = { status: next };
      if (next === 'published') patch.published_at = new Date().toISOString();
      const { error } = await supabase.from('gift_contents').update(patch).eq('id', id);
      toast(error ? '変更に失敗しました' : (next==='published'?'公開しました🎁':'非公開にしました'));
      loadList();
    }
    async function delPost(id){
      if (!confirm('この記事を削除しますか？')) return;
      const { error } = await supabase.from('gift_contents').delete().eq('id', id);
      toast(error ? '削除に失敗しました' : '削除しました');
      if (id === currentEditId){ currentEditId=null; titleInput.value=''; bodyInput.value=''; tableInput.value=''; renderPreview(); }
      loadList();
    }

    loadKeyword();
    loadList();
  }
}
</script>
</body>
</html>
