<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>新規登録 — mio億トレ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png">
<meta name="theme-color" content="#F7F2EA">
<style>
:root{
  --bg: #F7F2EA;
  --bg-soft: #EFE7DA;
  --bg-card: #FFFEFB;
  --ink: #3A2E2A;
  --ink-mid: #6B5D57;
  --ink-soft: #998B83;
  --rose: #C98B95;
  --rose-soft: #E8D0D2;
  --rose-deep: #B06B75;
  --sage: #9BB59C;
  --line: rgba(58,46,42,0.08);
  --line-strong: rgba(58,46,42,0.14);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html, body{ width: 100%; min-height: 100vh; }
body{
  font-family: 'Noto Sans JP', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.app{
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 0 24px;
}
.logo-area{
  padding: 48px 0 32px;
  text-align: center;
}
.logo-mark{
  width: 56px; height: 56px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: var(--rose-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif JP', serif;
  font-size: 24px;
  font-weight: 600;
  color: var(--rose-deep);
}
.logo-text{
  font-family: 'Cormorant Garamond', serif;
  font-size: 14px;
  letter-spacing: 0.32em;
  color: var(--rose-deep);
  text-transform: uppercase;
}
.form-area{
  flex: 1;
  display: flex;
  flex-direction: column;
  padding-top: 16px;
}
.title{
  font-family: 'Noto Serif JP', serif;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}
.subtitle{
  font-size: 12px;
  color: var(--ink-mid);
  letter-spacing: 0.04em;
  margin-bottom: 32px;
}
.input-group{ margin-bottom: 16px; }
.label{
  display: block;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-mid);
  margin-bottom: 6px;
  letter-spacing: 0.08em;
}
.input{
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: var(--bg-card);
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  transition: border-color 0.2s;
}
.input:focus{
  outline: none;
  border-color: var(--rose);
}
.help{
  font-size: 11px;
  color: var(--ink-soft);
  margin-top: 4px;
}
.submit-btn{
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 10px;
  background: var(--rose);
  color: #FFFFFF;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.08em;
  cursor: pointer;
  margin-top: 8px;
  transition: background 0.2s;
}
.submit-btn:hover{ background: var(--rose-deep); }
.submit-btn:disabled{
  opacity: 0.5;
  cursor: not-allowed;
}
.links{
  margin-top: 24px;
  text-align: center;
  font-size: 12px;
  color: var(--ink-mid);
}
.links a{
  color: var(--rose-deep);
  text-decoration: none;
  font-weight: 500;
}
.links a:hover{ text-decoration: underline; }
.message{
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 12px;
  margin-bottom: 16px;
  display: none;
  line-height: 1.6;
}
.message.success{
  background: #E5EDE9;
  color: #2D5F4F;
}
.message.error{
  background: #FBEAF0;
  color: #993556;
}
.message.show{ display: block; }
.terms{
  font-size: 11px;
  color: var(--ink-soft);
  text-align: center;
  margin-top: 16px;
  line-height: 1.8;
}
.footer{
  padding: 32px 0;
  text-align: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--ink-soft);
}
.footer a{
  color: var(--ink-soft);
  text-decoration: none;
}
</style>
</head>
<body>

<div class="app">

  <div class="logo-area">
    <div class="logo-mark">m</div>
    <div class="logo-text">mio okutore</div>
  </div>

  <div class="form-area">
    <h1 class="title">アカウントを作成</h1>
    <p class="subtitle">無料でmio AIをお試しいただけます</p>

    <div class="message" id="message"></div>

    <form id="registerForm">
      <div class="input-group">
        <label class="label">メールアドレス</label>
        <input type="email" id="email" class="input" placeholder="your@email.com" required autocomplete="email">
      </div>

      <div class="input-group">
        <label class="label">パスワード</label>
        <input type="password" id="password" class="input" placeholder="••••••••" required autocomplete="new-password" minlength="6">
        <div class="help">6文字以上で入力してください</div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">アカウントを作成</button>
    </form>

    <p class="terms">
      登録すると、利用規約とプライバシーポリシーに<br>
      ご同意いただいたものとします
    </p>

    <div class="links">
      すでにアカウントをお持ちの方は<br>
      <a href="login.html">ログインはこちら</a>
    </div>
  </div>

  <div class="footer">
    <a href="index.html">— back to home —</a>
  </div>

</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://iupkaxzesrximmfkipzd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1cGtheHplc3J4aW1tZmtpcHpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDcyNzM5MTYsImV4cCI6MjA2Mjg0OTkxNn0.jDZOxyLkSd3NcZgIKHJGOK9m8D561eqoQYbOUxtFYOQ';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// すでにログインしている場合はダッシュボードへ
const { data: { session } } = await supabase.auth.getSession();
if (session) {
  window.location.href = 'dashboard.html';
}

const form = document.getElementById('registerForm');
const message = document.getElementById('message');
const submitBtn = document.getElementById('submitBtn');

function showMessage(text, type = 'error') {
  message.innerHTML = text;
  message.className = 'message show ' + type;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (password.length < 6) {
    showMessage('パスワードは6文字以上で入力してください', 'error');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = '登録中...';
  message.classList.remove('show');

  try {
    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: {
        emailRedirectTo: window.location.origin + '/dashboard.html'
      }
    });

    if (error) {
      let errMsg = '登録に失敗しました';
      if (error.message.includes('already registered')) {
        errMsg = 'このメールアドレスはすでに登録されています';
      }
      showMessage(errMsg, 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'アカウントを作成';
      return;
    }

    showMessage('ご登録ありがとうございます🌸<br>確認メールをお送りしました。メール内のリンクをクリックしてご登録を完了してください', 'success');
    form.reset();
    submitBtn.textContent = '送信完了';

  } catch (err) {
    showMessage('エラーが発生しました', 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = 'アカウントを作成';
  }
});
</script>

</body>
</html>
