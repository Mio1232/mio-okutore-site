<title>配信スケジュール 管理 — mio億トレ</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #F7F2EA;
  --bg-soft: #EFE7DA;
  --bg-card: #FFFEFB;
  --ink: #3A2E2A;
  --ink-mid: #6B5D57;
  --ink-soft: #998B83;
  --rose: #C98B95;
  --rose-soft: #E8D0D2;
  --sage: #9BB59C;
  --sage-soft: #D5DFCE;
  --honey: #D4B677;
  --honey-soft: #ECDDB8;
  --mauve: #A89BB0;
  --mauve-soft: #DCD3DC;
  --terra: #C28D6F;
  --terra-soft: #E8D5C5;
  --discord: #5865F2;
  --discord-soft: #D4D7F7;
  --line: rgba(58,46,42,0.08);
  --line-strong: rgba(58,46,42,0.14);
  --shadow-sm: 0 2px 8px rgba(58,46,42,0.04);
  --r-lg: 20px;
  --r-md: 16px;
  --r-sm: 12px;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family: 'Noto Sans JP', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-weight: 400;
  letter-spacing: 0.01em;
  overflow-x: hidden;
  font-feature-settings: "palt";
}

.app{
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg);
  position: relative;
  padding-bottom: 40px;
  overflow: hidden;
}
.app::before{
  content:''; position: absolute;
  top: -80px; right: -120px;
  width: 280px; height: 280px;
  background: radial-gradient(circle, rgba(88,101,242,0.08), transparent 70%);
  border-radius: 50%;
  z-index: 0; pointer-events: none;
}

/* HEADER */
.page-header{
  position: sticky; top: 0; z-index: 50;
  background: rgba(247,242,234,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
  padding: 14px 18px;
  display: flex; align-items: center; gap: 12px;
}
.back-btn{
  width: 36px; height: 36px;
  background: var(--bg-card);
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  color: var(--ink-mid); text-decoration: none;
}
.back-btn svg{ width: 16px; height: 16px; }
.title-wrap{ flex: 1; min-width: 0; }
.page-title{
  font-family: 'Noto Serif JP', serif;
  font-size: 15px; font-weight: 700;
  letter-spacing: 0.04em; line-height: 1.1;
}
.page-sub{
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  color: var(--ink-soft);
  font-weight: 500;
  margin-top: 3px;
  letter-spacing: 0.04em;
}
.admin-badge{
  display: inline-flex;
  align-items: center;
  font-family: 'Inter', sans-serif;
  font-size: 9px;
  color: var(--rose);
  background: var(--rose-soft);
  padding: 3px 7px;
  border-radius: 4px;
  font-weight: 700;
  letter-spacing: 0.08em;
}

/* NOTICE */
.notice{
  position: relative; z-index: 5;
  margin: 14px 18px 14px;
  padding: 12px 14px;
  background: var(--honey-soft);
  border: 1px solid rgba(212,182,119,0.4);
  border-radius: var(--r-sm);
  font-size: 11px;
  line-height: 1.65;
  color: #6F5520;
}
.notice strong{ font-weight: 700; }

/* FORM CARD */
.form-card{
  position: relative; z-index: 5;
  margin: 0 18px 20px;
  padding: 18px 18px 16px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
}
.form-card-title{
  font-family: 'Noto Serif JP', serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.04em;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.form-card-title svg{ width: 16px; height: 16px; color: var(--rose); }

.field{
  margin-bottom: 12px;
}
.field-label{
  display: block;
  font-family: 'Inter', sans-serif;
  font-size: 9.5px;
  color: var(--ink-mid);
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 5px;
}
.field-label .required{ color: var(--rose); margin-left: 3px; }
.field input,
.field textarea,
.field select{
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  padding: 10px 12px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 13px;
  color: var(--ink);
  font-weight: 400;
  letter-spacing: 0.01em;
  outline: none;
}
.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color: var(--rose);
  background: var(--bg-card);
}
.field textarea{
  resize: vertical;
  min-height: 60px;
  line-height: 1.6;
  font-family: inherit;
}
.field-row{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.field-hint{
  font-size: 10px;
  color: var(--ink-soft);
  margin-top: 4px;
  line-height: 1.5;
}

.form-actions{
  display: flex;
  gap: 8px;
  margin-top: 14px;
}
.btn{
  flex: 1;
  padding: 11px 16px;
  border-radius: 12px;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.06em;
  cursor: pointer;
  border: none;
}
.btn:active{ transform: scale(0.98); }
.btn-primary{
  background: var(--ink);
  color: var(--bg);
}
.btn-secondary{
  background: var(--bg-card);
  color: var(--ink-mid);
  border: 1px solid var(--line-strong);
}

/* SECTION TITLE */
.section-title{
  position: relative; z-index: 5;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 4px 22px 12px;
  margin-top: 6px;
}
.section-title h2{
  font-family: 'Noto Serif JP', serif;
  font-size: 14px;
  font-weight: 700;
  margin: 0;
  letter-spacing: 0.04em;
}
.section-title .meta{
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  color: var(--ink-soft);
  font-weight: 500;
}

/* EVENT CARDS */
.event-list{
  position: relative; z-index: 5;
  padding: 0 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.event-card{
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
}
.event-card-head{
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.type-chip{
  font-family: 'Inter', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  padding: 2px 7px;
  border-radius: 4px;
  text-transform: uppercase;
}
.chip-regular{ background: var(--discord-soft); color: #4350CC; }
.chip-indicator{ background: var(--honey-soft); color: #8B7036; }
.event-card-time{
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  color: var(--ink-soft);
  font-weight: 500;
  margin-left: auto;
}
.event-card-title{
  font-family: 'Noto Serif JP', serif;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.55;
  margin-bottom: 6px;
  letter-spacing: 0.02em;
}
.event-card-host{
  font-size: 11px;
  color: var(--ink-mid);
  margin-bottom: 6px;
}
.event-card-host .label{
  color: var(--ink-soft);
  font-size: 10px;
  margin-right: 4px;
}
.event-card-desc{
  font-size: 11px;
  line-height: 1.6;
  color: var(--ink-mid);
  background: var(--bg);
  padding: 8px 10px;
  border-radius: 8px;
  margin-bottom: 10px;
}
.event-card-actions{
  display: flex;
  gap: 6px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}
.btn-mini{
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid var(--line-strong);
  background: var(--bg-card);
  color: var(--ink-mid);
  letter-spacing: 0.05em;
}
.btn-mini.edit{ color: var(--ink); }
.btn-mini.delete{
  color: var(--rose);
  border-color: var(--rose-soft);
}

/* EMPTY */
.empty-state{
  text-align: center;
  padding: 48px 24px;
}
.empty-title{
  font-family: 'Noto Serif JP', serif;
  font-size: 13px;
  color: var(--ink-mid);
  font-weight: 700;
  margin-bottom: 4px;
}
.empty-desc{
  font-size: 11px;
  color: var(--ink-soft);
}

/* TOAST */
.toast{
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bg);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 12px;
  font-weight: 600;
  padding: 10px 18px;
  border-radius: 999px;
  box-shadow: 0 8px 24px rgba(58,46,42,0.25);
  z-index: 200;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
  letter-spacing: 0.04em;
}
.toast.show{
  opacity: 1;
  transform: translateX(-50%) translateY(-8px);
}
.toast.error{ background: #B07474; }

</style>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="page-header">
    <a class="back-btn" href="events.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div class="title-wrap">
      <div class="page-title">配信スケジュール 管理</div>
      <div class="page-sub">
        <span class="admin-badge">ADMIN</span>
        <span style="margin-left:6px;">配信の追加・編集・削除</span>
      </div>
    </div>
  </header>

  <!-- NOTICE -->
  <div class="notice">
    <strong>💡 使い方</strong><br>
    トレード配信(定期配信)または指標トレード配信(経済指標発表時)を追加します。ホストは4人の中から選択してください。
  </div>

  <!-- FORM -->
  <section class="form-card">
    <div class="form-card-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span id="form-title">新規配信を追加</span>
    </div>

    <div class="field">
      <label class="field-label">配信タイトル<span class="required">*</span></label>
      <input type="text" id="f-title" placeholder="例: 朝のドル円トレード配信">
    </div>

    <div class="field-row">
      <div class="field">
        <label class="field-label">配信種別<span class="required">*</span></label>
        <select id="f-type">
          <option value="regular">トレード配信</option>
          <option value="indicator">指標トレード配信</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">配信ホスト<span class="required">*</span></label>
        <select id="f-host">
          <option value="mio">mio</option>
          <option value="miyabi">みやび</option>
          <option value="sakura">さくら</option>
          <option value="hinata">ひなた</option>
        </select>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label class="field-label">日付<span class="required">*</span></label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label class="field-label">開始時刻<span class="required">*</span></label>
        <input type="time" id="f-time">
      </div>
    </div>

    <div class="field">
      <label class="field-label">配信時間(分)</label>
      <input type="number" id="f-duration" min="15" max="480" step="15" value="60" placeholder="60">
      <div class="field-hint">LIVE表示の期間に使用されます(デフォルト60分)</div>
    </div>

    <div class="field">
      <label class="field-label">説明(任意)</label>
      <textarea id="f-description" placeholder="例: ドル円のロンドンタイム狙い目を解説しながら、エントリーポイントを共有します" rows="3"></textarea>
    </div>

    <div class="form-actions">
      <button class="btn btn-secondary" id="btn-cancel" style="display:none;">キャンセル</button>
      <button class="btn btn-primary" id="btn-save">保存</button>
    </div>
  </section>

  <!-- EVENT LIST -->
  <div class="section-title">
    <h2>登録済みの配信</h2>
    <span class="meta" id="event-count">0件</span>
  </div>

  <div class="event-list" id="event-list">
    <div class="empty-state">
      <div class="empty-title">まだ配信がありません</div>
      <div class="empty-desc">上のフォームから追加してください</div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const HOST_NAMES = { mio: 'mio', miyabi: 'みやび', sakura: 'さくら', hinata: 'ひなた' };
const TYPE_LABELS = { regular: 'トレード配信', indicator: '指標トレード' };
const TYPE_CLASSES = { regular: 'chip-regular', indicator: 'chip-indicator' };

let events = [];
let editingId = null;

function genId() {
  return 'e_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

async function load() {
  try {
    const { data, error } = await sb
      .from('discord_events')
      .select('*')
      .order('datetime', { ascending: true });
    if (error) throw error;
    events = (data || []).map(row => ({
      id: row.id,
      title: row.title,
      startTime: row.datetime,
      hostId: row.host || 'mio',
      type: row.type || 'regular',
      duration: row.duration || 60,
      description: row.description || ''
    }));
  } catch (err) {
    console.error('Load error:', err);
    events = [];
    showToast('読み込みエラー: ' + err.message, true);
  }
  render();
}

async function insertEvent(data) {
  try {
    const { error } = await sb.from('discord_events').insert({
      title: data.title,
      datetime: data.startTime,
      host: data.hostId,
      type: data.type,
      duration: data.duration,
      description: data.description
    });
    if (error) throw error;
    return true;
  } catch (err) {
    showToast('保存失敗: ' + err.message, true);
    return false;
  }
}

async function updateEvent(id, data) {
  try {
    const { error } = await sb.from('discord_events').update({
      title: data.title,
      datetime: data.startTime,
      host: data.hostId,
      type: data.type,
      duration: data.duration,
      description: data.description
    }).eq('id', id);
    if (error) throw error;
    return true;
  } catch (err) {
    showToast('更新失敗: ' + err.message, true);
    return false;
  }
}

async function removeEvent(id) {
  try {
    const { error } = await sb.from('discord_events').delete().eq('id', id);
    if (error) throw error;
    return true;
  } catch (err) {
    showToast('削除失敗: ' + err.message, true);
    return false;
  }
}

function escapeHtml(s) {
  if (s == null) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function formatDateTime(iso) {
  const d = new Date(iso);
  const dows = ['日','月','火','水','木','金','土'];
  return `${d.getMonth()+1}/${d.getDate()}(${dows[d.getDay()]}) ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function getFormValues() {
  const title = document.getElementById('f-title').value.trim();
  const type = document.getElementById('f-type').value;
  const hostId = document.getElementById('f-host').value;
  const date = document.getElementById('f-date').value;
  const time = document.getElementById('f-time').value;
  const duration = parseInt(document.getElementById('f-duration').value, 10) || 60;
  const description = document.getElementById('f-description').value.trim();

  if (!title) { showToast('タイトルを入力してください', true); return null; }
  if (!date || !time) { showToast('日付と時刻を入力してください', true); return null; }

  const startTime = new Date(`${date}T${time}:00`).toISOString();

  return { title, type, hostId, startTime, duration, description };
}

function clearForm() {
  document.getElementById('f-title').value = '';
  document.getElementById('f-type').value = 'regular';
  document.getElementById('f-host').value = 'mio';
  document.getElementById('f-duration').value = '60';
  document.getElementById('f-description').value = '';
  const now = new Date();
  const tzOffset = now.getTimezoneOffset() * 60000;
  const local = new Date(now.getTime() - tzOffset).toISOString().slice(0, 16);
  document.getElementById('f-date').value = local.slice(0, 10);
  document.getElementById('f-time').value = local.slice(11, 16);
  editingId = null;
  document.getElementById('form-title').textContent = '新規配信を追加';
  document.getElementById('btn-cancel').style.display = 'none';
  document.getElementById('btn-save').textContent = '保存';
}

document.getElementById('btn-save').addEventListener('click', async () => {
  const data = getFormValues();
  if (!data) return;

  const success = editingId
    ? await updateEvent(editingId, data)
    : await insertEvent(data);

  if (success) {
    showToast(editingId ? '更新しました' : '追加しました');
    clearForm();
    await load();
  }
});

document.getElementById('btn-cancel').addEventListener('click', clearForm);

function startEdit(id) {
  const e = events.find(x => x.id === id);
  if (!e) return;
  editingId = id;
  document.getElementById('f-title').value = e.title;
  document.getElementById('f-type').value = e.type || 'regular';
  document.getElementById('f-host').value = e.hostId || 'mio';
  document.getElementById('f-duration').value = e.duration || 60;
  document.getElementById('f-description').value = e.description || '';
  const d = new Date(e.startTime);
  const tzOffset = d.getTimezoneOffset() * 60000;
  const local = new Date(d.getTime() - tzOffset).toISOString().slice(0, 16);
  document.getElementById('f-date').value = local.slice(0, 10);
  document.getElementById('f-time').value = local.slice(11, 16);
  document.getElementById('form-title').textContent = '配信を編集';
  document.getElementById('btn-cancel').style.display = 'block';
  document.getElementById('btn-save').textContent = '更新';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteEvent(id) {
  if (!confirm('この配信を削除しますか?')) return;
  if (await removeEvent(id)) {
    showToast('削除しました');
    if (editingId === id) clearForm();
    await load();
  }
}

function render() {
  const list = document.getElementById('event-list');
  document.getElementById('event-count').textContent = `${events.length}件`;

  if (events.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-title">まだ配信がありません</div>
        <div class="empty-desc">上のフォームから追加してください</div>
      </div>
    `;
    return;
  }

  const sorted = [...events].sort((a,b) => new Date(b.startTime) - new Date(a.startTime));

  list.innerHTML = sorted.map(e => {
    const type = e.type || 'regular';
    const typeLabel = TYPE_LABELS[type] || 'トレード配信';
    const typeClass = TYPE_CLASSES[type] || 'chip-regular';
    const hostName = HOST_NAMES[e.hostId] || 'mio';
    return `
      <div class="event-card">
        <div class="event-card-head">
          <span class="type-chip ${typeClass}">${typeLabel}</span>
          <span class="event-card-time">${formatDateTime(e.startTime)}</span>
        </div>
        <div class="event-card-title">${escapeHtml(e.title)}</div>
        <div class="event-card-host">
          <span class="label">ホスト:</span>${escapeHtml(hostName)} · ${e.duration || 60}分
        </div>
        ${e.description ? `<div class="event-card-desc">${escapeHtml(e.description)}</div>` : ''}
        <div class="event-card-actions">
          <button class="btn-mini edit" data-action="edit" data-id="${e.id}">編集</button>
          <button class="btn-mini delete" data-action="delete" data-id="${e.id}">削除</button>
        </div>
      </div>
    `;
  }).join('');

  list.querySelectorAll('[data-action="edit"]').forEach(btn => {
    btn.addEventListener('click', () => startEdit(btn.dataset.id));
  });
  list.querySelectorAll('[data-action="delete"]').forEach(btn => {
    btn.addEventListener('click', () => deleteEvent(btn.dataset.id));
  });
}

clearForm();
load();
</script>

</body>
</html>
