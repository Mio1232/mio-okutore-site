<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>みおAI — mio億トレ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #F7F2EA;
  --bg-soft: #EFE7DA;
  --bg-card: #FFFEFB;
  --card: #FFFFFF;

  --ink: #3A2E2A;
  --ink-mid: #6B5D57;
  --ink-soft: #998B83;

  --rose: #C98B95;
  --rose-soft: #E8D0D2;
  --sage: #9BB59C;
  --sage-soft: #D5DFCE;
  --honey: #D4B677;
  --honey-soft: #ECDDB8;
  --mauve: #A89BB0;
  --mauve-soft: #DCD3DC;
  --terra: #C28D6F;
  --terra-soft: #E8D5C5;

  --line: rgba(58,46,42,0.08);
  --line-strong: rgba(58,46,42,0.14);
  --shadow-sm: 0 2px 8px rgba(58,46,42,0.04);
  --shadow-md: 0 8px 24px rgba(58,46,42,0.06);

  --r-lg: 20px;
  --r-md: 16px;
  --r-sm: 12px;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family: 'Noto Sans JP', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-weight: 400;
  letter-spacing: 0.01em;
  overflow: hidden;
  height: 100dvh;
  font-feature-settings: "palt";
}

.app{
  max-width: 430px;
  margin: 0 auto;
  height: 100dvh;
  background: var(--bg);
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.app::before{
  content:''; position: absolute;
  top: 80px; right: -100px;
  width: 260px; height: 260px;
  background: radial-gradient(circle, rgba(201,139,149,0.10), transparent 70%);
  border-radius: 50%;
  z-index: 0; pointer-events: none;
}
.app::after{
  content:''; position: absolute;
  bottom: 180px; left: -100px;
  width: 260px; height: 260px;
  background: radial-gradient(circle, rgba(155,181,156,0.08), transparent 70%);
  border-radius: 50%;
  z-index: 0; pointer-events: none;
}

/* HEADER */
.chat-header{
  position: relative; z-index: 10;
  padding: 16px 18px;
  background: rgba(247,242,234,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px;
}
.back-btn{
  width: 36px; height: 36px;
  background: var(--bg-card);
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  color: var(--ink-mid);
  transition: all 0.2s;
}
.back-btn:active{ transform: scale(0.96); }
.back-btn svg{ width: 16px; height: 16px; }

.chat-header-info{ flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; }
.chat-avatar-wrap{ position: relative; flex-shrink: 0; }
.chat-avatar{
  width: 42px; height: 42px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid var(--line-strong);
}
.status-dot{
  position: absolute;
  bottom: 0; right: 0;
  width: 11px; height: 11px;
  background: var(--sage);
  border: 2px solid var(--bg);
  border-radius: 50%;
}
.chat-name{
  font-family: 'Noto Serif JP', serif;
  font-weight: 700;
  font-size: 15px;
  line-height: 1.2;
  letter-spacing: 0.04em;
  color: var(--ink);
  display: flex; align-items: center; gap: 5px;
}
.chat-name .ai-tag{
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 9px;
  letter-spacing: 0.12em;
  color: var(--rose);
  background: var(--rose-soft);
  padding: 2px 6px;
  border-radius: 4px;
}
.chat-status{
  font-size: 10.5px;
  color: var(--ink-soft);
  font-weight: 400;
  margin-top: 3px;
  display: flex; align-items: center; gap: 5px;
}
.chat-status .live{
  width: 5px; height: 5px;
  background: var(--sage);
  border-radius: 50%;
  animation: pulse 2s infinite;
}
@keyframes pulse{
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.header-action{
  width: 36px; height: 36px;
  background: var(--bg-card);
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  color: var(--ink-mid);
}
.header-action svg{ width: 16px; height: 16px; }

/* MESSAGES */
.messages{
  flex: 1;
  overflow-y: auto;
  padding: 22px 18px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
  z-index: 1;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar{ width: 0; }

/* INTRO */
.intro-card{
  background: linear-gradient(135deg, #FAF0E8 0%, #F2E4D6 100%);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 24px 22px;
  box-shadow: var(--shadow-md);
  position: relative;
  margin-bottom: 8px;
}
.intro-eyebrow{
  font-family: 'Inter', sans-serif;
  font-size: 9.5px;
  letter-spacing: 0.18em;
  color: var(--rose);
  font-weight: 600;
  text-transform: uppercase;
  margin-bottom: 14px;
}
.intro-row{ display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.intro-face{
  width: 56px; height: 56px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  border: 2px solid var(--bg-card);
  box-shadow: 0 4px 14px rgba(58,46,42,0.10);
}
.intro-greeting{
  font-size: 11px;
  color: var(--ink-mid);
  font-weight: 400;
  margin-bottom: 4px;
}
.intro-title{
  font-family: 'Noto Serif JP', serif;
  font-size: 18px;
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: 0.02em;
  color: var(--ink);
}
.intro-desc{
  font-size: 12px;
  color: var(--ink-mid);
  font-weight: 400;
  line-height: 1.75;
}

/* SUGGESTIONS */
.suggest-label{
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  color: var(--ink-soft);
  font-weight: 500;
  margin: 12px 4px 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 8px;
}
.suggest-label::before, .suggest-label::after{
  content: '';
  flex: 1; height: 1px;
  background: var(--line-strong);
}
.chips{
  display: flex; flex-direction: column; gap: 8px;
  margin-bottom: 8px;
}
.chip{
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 14px 16px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all 0.2s;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--ink);
}
.chip:active{ transform: translateY(1px); box-shadow: none; }
.chip-icon{
  width: 28px; height: 28px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.chip-icon svg{ width: 14px; height: 14px; }
.chip-text{ flex: 1; line-height: 1.3; }
.chip-arrow{ font-size: 12px; color: var(--ink-soft); }

.bg-rose{ background: var(--rose-soft); color: #8B5A65; }
.bg-sage{ background: var(--sage-soft); color: #5E7A60; }
.bg-honey{ background: var(--honey-soft); color: #8B7036; }
.bg-mauve{ background: var(--mauve-soft); color: #6E5F7E; }
.bg-terra{ background: var(--terra-soft); color: #8B5C3F; }

/* BUBBLES */
.msg-row{
  display: flex;
  align-items: flex-end;
  gap: 8px;
  max-width: 100%;
}
.msg-row.ai{ justify-content: flex-start; }
.msg-row.user{ justify-content: flex-end; }

.msg-avatar{
  width: 30px; height: 30px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  border: 1px solid var(--line);
}

.bubble{
  max-width: 78%;
  padding: 12px 16px;
  font-size: 13px;
  line-height: 1.7;
  font-weight: 400;
  word-wrap: break-word;
  position: relative;
  letter-spacing: 0.02em;
}
.bubble.ai{
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 16px 16px 16px 4px;
  box-shadow: var(--shadow-sm);
  color: var(--ink);
}
.bubble.user{
  background: var(--ink);
  color: var(--bg);
  border-radius: 16px 16px 4px 16px;
  font-weight: 400;
}
.bubble strong{ font-weight: 700; }

.msg-time{
  font-family: 'Inter', sans-serif;
  font-size: 9.5px;
  color: var(--ink-soft);
  font-weight: 400;
  margin-top: 4px;
  padding: 0 4px;
  letter-spacing: 0.05em;
}

/* Tag chips inside AI message */
.tag-row{
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}
.tag-chip{
  font-family: 'Inter', sans-serif;
  font-size: 9.5px;
  font-weight: 500;
  padding: 3px 8px;
  border-radius: 4px;
  background: var(--sage-soft);
  color: #5E7A60;
  letter-spacing: 0.05em;
}
.tag-chip.rose{ background: var(--rose-soft); color: #8B5A65; }
.tag-chip.mauve{ background: var(--mauve-soft); color: #6E5F7E; }

/* TYPING */
.typing{
  display: flex; gap: 5px;
  align-items: center;
  padding: 14px 18px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 16px 16px 16px 4px;
  box-shadow: var(--shadow-sm);
  width: fit-content;
}
.typing-dot{
  width: 6px; height: 6px;
  background: var(--rose);
  border-radius: 50%;
  animation: typing 1.4s infinite ease-in-out;
  opacity: 0.4;
}
.typing-dot:nth-child(2){ animation-delay: 0.2s; }
.typing-dot:nth-child(3){ animation-delay: 0.4s; }
@keyframes typing{
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-5px); opacity: 1; }
}

/* INPUT */
.input-bar{
  position: relative; z-index: 10;
  padding: 12px 16px 16px;
  background: rgba(247,242,234,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
  display: flex;
  align-items: flex-end;
  gap: 8px;
}
.attach-btn{
  width: 42px; height: 42px;
  background: var(--bg-card);
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  color: var(--ink-mid);
}
.attach-btn svg{ width: 18px; height: 18px; }

.input-wrap{
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--line-strong);
  border-radius: 22px;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  min-height: 42px;
  transition: border-color 0.2s;
}
.input-wrap:focus-within{
  border-color: var(--rose);
}
.input-wrap textarea{
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 13px;
  font-weight: 400;
  color: var(--ink);
  resize: none;
  line-height: 1.5;
  max-height: 80px;
  padding: 2px 0;
  letter-spacing: 0.02em;
}
.input-wrap textarea::placeholder{
  color: var(--ink-soft);
  font-weight: 400;
}
.send-btn{
  width: 44px; height: 44px;
  background: var(--ink);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.2s;
  color: var(--bg);
}
.send-btn:active{ transform: scale(0.96); }
.send-btn svg{ width: 16px; height: 16px; }

.disclaimer{
  text-align: center;
  font-family: 'Inter', sans-serif;
  font-size: 9.5px;
  color: var(--ink-soft);
  font-weight: 400;
  padding: 0 18px 10px;
  background: rgba(247,242,234,0.92);
  position: relative;
  z-index: 10;
  letter-spacing: 0.04em;
}

</style>
</head>
