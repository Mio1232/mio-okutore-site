<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>みおAI — mio億トレ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #F7F2EA;
  --bg-soft: #EFE7DA;
  --bg-card: #FFFEFB;
  --ink: #3A2E2A;
  --ink-mid: #6B5D57;
  --ink-soft: #998B83;
  --rose: #C98B95;
  --rose-soft: #E8D0D2;
  --rose-deep: #B06B75;
  --sage: #9BB59C;
  --sage-soft: #D5DFCE;
  --honey: #D4B677;
  --line: rgba(58,46,42,0.08);
  --line-strong: rgba(58,46,42,0.14);
  --shadow-sm: 0 2px 6px rgba(58,46,42,0.04);
  --shadow-md: 0 8px 24px rgba(58,46,42,0.06);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html, body{
  width: 100%;
  height: 100%;
  overflow: hidden;
}
body{
  font-family: 'Noto Sans JP', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  position: fixed;
  inset: 0;
}

.app{
  max-width: 430px;
  margin: 0 auto;
  height: 100%;
  height: 100dvh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* HEADER */
.page-header{
  flex-shrink: 0;
  background: rgba(247,242,234,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
  padding: 14px 18px;
  display: flex; align-items: center; gap: 12px;
}
.back-btn{
  width: 36px; height: 36px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  color: var(--ink-mid); text-decoration: none;
}
.back-btn svg{ width: 16px; height: 16px; }

.mio-avatar{
  width: 40px; height: 40px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--rose-soft);
  flex-shrink: 0;
  background: var(--rose-soft);
}
.header-info{ flex: 1; min-width: 0; }
.header-name{
  font-family: 'Noto Serif JP', serif;
  font-size: 14px; font-weight: 600;
  letter-spacing: 0.04em;
  line-height: 1.2;
}
.header-status{
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  color: var(--sage);
  margin-top: 2px;
  display: flex; align-items: center; gap: 4px;
}
.header-status::before{
  content: '';
  width: 6px; height: 6px;
  background: var(--sage);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* MESSAGES AREA */
.messages{
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.msg{
  display: flex;
  gap: 8px;
  align-items: flex-end;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn{
  from{ opacity: 0; transform: translateY(8px); }
  to{ opacity: 1; transform: translateY(0); }
}
.msg.user{ flex-direction: row-reverse; }

.msg-avatar{
  width: 32px; height: 32px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--rose-soft);
}
.msg.user .msg-avatar{ display: none; }

.msg-bubble{
  max-width: 78%;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 13.5px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-wrap: break-word;
}
.msg.ai .msg-bubble{
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-bottom-left-radius: 6px;
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}
.msg.user .msg-bubble{
  background: var(--ink);
  color: var(--bg);
  border-bottom-right-radius: 6px;
}

/* Typing indicator */
.typing{
  display: flex;
  gap: 4px;
  padding: 4px 0;
}
.typing span{
  width: 6px; height: 6px;
  background: var(--ink-soft);
  border-radius: 50%;
  animation: typing 1.4s ease-in-out infinite;
}
.typing span:nth-child(2){ animation-delay: 0.2s; }
.typing span:nth-child(3){ animation-delay: 0.4s; }
@keyframes typing{
  0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-3px); }
}

/* Welcome screen */
.welcome{
  padding: 30px 24px 20px;
  text-align: center;
}
.welcome-avatar{
  width: 80px; height: 80px;
  border-radius: 50%;
  object-fit: cover;
  margin: 0 auto 14px;
  border: 3px solid var(--rose-soft);
  box-shadow: var(--shadow-md);
  background: var(--rose-soft);
}
.welcome h2{
  font-family: 'Noto Serif JP', serif;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}
.welcome .en{
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 11px;
  color: var(--rose-deep);
  letter-spacing: 0.16em;
  margin-bottom: 14px;
}
.welcome p{
  font-size: 12px;
  color: var(--ink-soft);
  line-height: 1.85;
  margin-bottom: 20px;
}
.suggestions{
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.suggestion{
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  font-family: inherit;
  font-size: 12.5px;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.2s;
  display: flex;
  align-items: center;
  gap: 10px;
}
.suggestion:active{ transform: scale(0.98); }
.suggestion:hover{
  box-shadow: var(--shadow-sm);
  border-color: var(--rose-soft);
}
.suggestion-emoji{
  font-size: 16px;
  flex-shrink: 0;
}

/* INPUT AREA */
.input-area{
  flex-shrink: 0;
  background: rgba(247,242,234,0.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.input-wrap{
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--line-strong);
  border-radius: 22px;
  padding: 4px 4px 4px 16px;
  display: flex;
  align-items: flex-end;
  gap: 6px;
  transition: border-color 0.2s;
}
.input-wrap:focus-within{
  border-color: var(--rose);
}
.msg-input{
  flex: 1;
  min-height: 36px;
  max-height: 100px;
  border: none;
  outline: none;
  background: transparent;
  font-family: inherit;
  font-size: 16px; /* 16px or larger prevents iOS zoom-in */
  line-height: 1.5;
  color: var(--ink);
  padding: 8px 0;
  resize: none;
  overflow-y: auto;
}
.msg-input::placeholder{ color: var(--ink-soft); }
.send-btn{
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--ink);
  color: var(--bg);
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.15s, background 0.2s;
}
.send-btn:active{ transform: scale(0.92); }
.send-btn:disabled{
  background: var(--ink-soft);
  cursor: not-allowed;
}
.send-btn svg{
  width: 16px; height: 16px;
}

/* Error toast */
.toast{
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bg);
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 12px;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.toast.show{ opacity: 1; }
.toast.error{ background: var(--rose-deep); }
</style>
<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/favicon-512.png">
<!-- OGP (SNS sharing) -->
<meta property="og:type" content="website">
<meta property="og:title" content="mio億トレ — FX × ゴールド × BTC のトレードコミュニティ">
<meta property="og:description" content="主宰mio、みやび、さくら、ひなたの4人で運営するトレードコミュニティ。FX・ゴールド・BTCの分析、配信、収支シェアまで。">
<meta property="og:url" content="https://miookutoresite.netlify.app/">
<meta property="og:image" content="https://miookutoresite.netlify.app/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:site_name" content="mio億トレ">
<meta property="og:locale" content="ja_JP">
<!-- Twitter / X Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="mio億トレ — FX × ゴールド × BTC のトレードコミュニティ">
<meta name="twitter:description" content="主宰mio、みやび、さくら、ひなたの4人で運営するトレードコミュニティ。FX・ゴールド・BTCの分析、配信、収支シェアまで。">
<meta name="twitter:image" content="https://miookutoresite.netlify.app/ogp.png">
<!-- Theme color (mobile browser bar) -->
<meta name="theme-color" content="#F7F2EA">
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header class="page-header">
    <a class="back-btn" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div class="mio-avatar" id="mio-avatar-circle" aria-label="美桜Mio"></div>
    <div class="header-info">
      <div class="header-name">美桜Mio AI</div>
      <div class="header-status">オンライン</div>
    </div>
  </header>

  <!-- MESSAGES -->
  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-avatar" id="welcome-avatar-circle"></div>
      <h2>美桜MioのAI</h2>
      <div class="en">— Ask me anything —</div>
      <p>トレードのこと、mio億トレコミュニティのこと、<br>お気軽にお聞きください 🌸</p>
      <div class="suggestions">
        <button class="suggestion" data-q="mio億トレってどんなコミュニティですか?">
          <span class="suggestion-emoji">💌</span>
          <span>mio億トレってどんなコミュニティ?</span>
        </button>
        <button class="suggestion" data-q="FX初心者ですが、まず何から学べばいいですか?">
          <span class="suggestion-emoji">📚</span>
          <span>FX初心者、何から学べばいい?</span>
        </button>
        <button class="suggestion" data-q="損切りができないのですが、どうしたらいいですか?">
          <span class="suggestion-emoji">💭</span>
          <span>損切りができない時は?</span>
        </button>
        <button class="suggestion" data-q="ドル円の動きをどう見ていますか?">
          <span class="suggestion-emoji">📈</span>
          <span>ドル円の見方を教えて</span>
        </button>
      </div>
    </div>
  </div>

  <!-- INPUT -->
  <div class="input-area">
    <div class="input-wrap">
      <textarea
        class="msg-input"
        id="msg-input"
        placeholder="メッセージを入力..."
        rows="1"
        autocomplete="off"
        autocapitalize="off"
      ></textarea>
      <button class="send-btn" id="send-btn" disabled aria-label="送信">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// Avatar styling — using initials M as placeholder
const initials = 'M';
const colors = { bg: '#E8D0D2', fg: '#B06B75' };
function makeAvatar(el, size) {
  el.style.background = colors.bg;
  el.style.display = 'flex';
  el.style.alignItems = 'center';
  el.style.justifyContent = 'center';
  el.style.fontFamily = "'Noto Serif JP', serif";
  el.style.fontWeight = '600';
  el.style.color = colors.fg;
  el.style.fontSize = (size * 0.45) + 'px';
  el.textContent = initials;
}
makeAvatar(document.getElementById('mio-avatar-circle'), 40);
makeAvatar(document.getElementById('welcome-avatar-circle'), 80);

const messagesEl = document.getElementById('messages');
const welcomeEl = document.getElementById('welcome');
const inputEl = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const toastEl = document.getElementById('toast');

let history = [];
let isLoading = false;

// Auto-resize textarea
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
  sendBtn.disabled = !inputEl.value.trim() || isLoading;
});

// Send on Enter (Shift+Enter = newline)
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

sendBtn.addEventListener('click', send);

// Suggestion buttons
document.querySelectorAll('.suggestion').forEach(btn => {
  btn.addEventListener('click', () => {
    inputEl.value = btn.dataset.q;
    inputEl.dispatchEvent(new Event('input'));
    send();
  });
});

function showToast(msg, isError) {
  toastEl.textContent = msg;
  toastEl.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => toastEl.classList.remove('show'), 3000);
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });
}

function makeBubbleAvatar() {
  const av = document.createElement('div');
  av.className = 'msg-avatar';
  makeAvatar(av, 32);
  return av;
}

function addMessage(role, content) {
  if (welcomeEl) welcomeEl.style.display = 'none';

  const msgEl = document.createElement('div');
  msgEl.className = 'msg ' + role;

  if (role === 'ai') {
    msgEl.appendChild(makeBubbleAvatar());
  }

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = content;
  msgEl.appendChild(bubble);

  messagesEl.appendChild(msgEl);
  scrollToBottom();
  return bubble;
}

function addTyping() {
  if (welcomeEl) welcomeEl.style.display = 'none';

  const msgEl = document.createElement('div');
  msgEl.className = 'msg ai';
  msgEl.id = 'typing-msg';

  msgEl.appendChild(makeBubbleAvatar());

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  msgEl.appendChild(bubble);

  messagesEl.appendChild(msgEl);
  scrollToBottom();
}

function removeTyping() {
  const t = document.getElementById('typing-msg');
  if (t) t.remove();
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || isLoading) return;

  addMessage('user', text);
  history.push({ role: 'user', content: text });

  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;
  isLoading = true;

  addTyping();

  try {
    const response = await fetch('/.netlify/functions/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history.slice(-10) })
    });

    removeTyping();

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      showToast('エラー: ' + (err.error || response.status), true);
      isLoading = false;
      sendBtn.disabled = !inputEl.value.trim();
      return;
    }

    const data = await response.json();
    const aiText = data.text || '申し訳ありません、うまくお答えできませんでした。';

    addMessage('ai', aiText);
    history.push({ role: 'assistant', content: aiText });

  } catch (err) {
    removeTyping();
    console.error(err);
    showToast('通信エラーが発生しました', true);
  } finally {
    isLoading = false;
    sendBtn.disabled = !inputEl.value.trim();
  }
}

// Keyboard handling: scroll to bottom when keyboard opens
inputEl.addEventListener('focus', () => {
  setTimeout(scrollToBottom, 300);
});

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    scrollToBottom();
  });
}
</script>

</body>
</html>
