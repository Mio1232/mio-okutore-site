<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>みおAI — mio億トレ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/favicon-512.png">
<meta property="og:type" content="website">
<meta property="og:title" content="みおAI — mio億トレ">
<meta property="og:description" content="美桜MioのAIアシスタント。トレードのご質問、いつでもお気軽に。">

<meta name="twitter:title" content="みおAI — mio億トレ">
<meta name="twitter:description" content="美桜MioのAIアシスタント。トレードのご質問、いつでもお気軽に。">
<meta name="twitter:image" content="/ogp.png">
<meta name="theme-color" content="#F7F2EA">
<style>
:root{
  --bg: #F7F2EA;
  --bg-soft: #EFE7DA;
  --bg-card: #FFFEFB;
  --ink: #3A2E2A;
  --ink-mid: #6B5D57;
  --ink-soft: #998B83;
  --rose: #C98B95;
  --rose-soft: #E8D0D2;
  --rose-deep: #B06B75;
  --sage: #9BB59C;
  --line: rgba(58,46,42,0.08);
  --line-strong: rgba(58,46,42,0.14);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html, body{ width: 100%; height: 100%; overflow: hidden; }
body{
  font-family: 'Noto Sans JP', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  position: fixed;
  inset: 0;
}
.app{
  max-width: 430px;
  margin: 0 auto;
  height: 100%;
  height: 100dvh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* HEADER */
.page-header{
  flex-shrink: 0;
  background: rgba(247,242,234,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
  padding: 14px 18px;
  display: flex; align-items: center; gap: 12px;
  z-index: 10;
}
.back-btn{
  width: 36px; height: 36px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  color: var(--ink-mid); text-decoration: none;
}
.back-btn svg{ width: 16px; height: 16px; }
.mio-avatar{
  width: 40px; height: 40px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--rose-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif JP', serif;
  font-weight: 600;
  color: var(--rose-deep);
  font-size: 18px;
  overflow: hidden;
}
.header-info{ flex: 1; min-width: 0; }
.header-name{
  font-family: 'Noto Serif JP', serif;
  font-size: 14px; font-weight: 600;
  letter-spacing: 0.04em;
  line-height: 1.2;
}
.header-status{
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  color: var(--sage);
  margin-top: 2px;
  display: flex; align-items: center; gap: 4px;
}
.header-status::before{
  content: '';
  width: 6px; height: 6px;
  background: var(--sage);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* IFRAME WRAPPER */
.chat-wrap{
  flex: 1;
  position: relative;
  overflow: hidden;
  background: var(--bg-card);
}
.chat-iframe{
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* LOADING */
.loading{
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  z-index: 5;
  transition: opacity 0.4s;
}
.loading.hidden{
  opacity: 0;
  pointer-events: none;
}
.loading-avatar{
  width: 64px; height: 64px;
  border-radius: 50%;
  background: var(--rose-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
  animation: float 2s ease-in-out infinite;
  background-image: url('/mio-icon.png');
  background-size: cover;
  background-position: center;
}
@keyframes float{
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
.loading-text{
  font-family: 'Noto Serif JP', serif;
  font-size: 14px;
  color: var(--ink-mid);
  letter-spacing: 0.05em;
}
.loading-en{
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 11px;
  color: var(--rose-deep);
  letter-spacing: 0.16em;
  margin-top: 6px;
}

/* LOGIN GATE */
.gate{
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 32px 48px;
  text-align: center;
  background: var(--bg);
  overflow-y: auto;
}
.gate-avatar{
  width: 96px; height: 96px;
  border-radius: 50%;
  background: var(--rose-soft);
  background-image: url('/mio-icon.png');
  background-size: cover;
  background-position: center;
  margin-bottom: 24px;
  box-shadow: 0 8px 24px rgba(201, 139, 149, 0.2);
  animation: float 3s ease-in-out infinite;
}
.gate-title{
  font-family: 'Noto Serif JP', serif;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}
.gate-subtitle{
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 14px;
  letter-spacing: 0.12em;
  color: var(--rose-deep);
  margin-bottom: 24px;
}
.gate-message{
  font-size: 13px;
  line-height: 2;
  color: var(--ink-mid);
  margin-bottom: 32px;
  max-width: 320px;
}
.gate-features{
  width: 100%;
  max-width: 320px;
  margin-bottom: 32px;
  text-align: left;
}
.feature-item{
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 18px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 8px;
}
.feature-icon{
  width: 32px; height: 32px;
  background: var(--rose-soft);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.feature-text{
  flex: 1;
  font-size: 12px;
  color: var(--ink-mid);
  line-height: 1.6;
}
.feature-text strong{
  color: var(--ink);
  display: block;
  margin-bottom: 2px;
  font-size: 13px;
}
.gate-actions{
  width: 100%;
  max-width: 320px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.gate-btn{
  display: block;
  width: 100%;
  padding: 14px 24px;
  border-radius: 10px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-decoration: none;
  text-align: center;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
}
.gate-btn-primary{
  background: var(--rose);
  color: #FFFFFF;
}
.gate-btn-primary:hover{
  background: var(--rose-deep);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(176, 107, 117, 0.25);
}
.gate-btn-secondary{
  background: transparent;
  color: var(--ink-mid);
  border: 1px solid var(--line-strong);
}
.gate-btn-secondary:hover{
  background: var(--bg-card);
  border-color: var(--rose);
  color: var(--rose-deep);
}
.gate-footer{
  margin-top: 24px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--ink-soft);
}
.gate-footer a{
  color: var(--ink-soft);
  text-decoration: none;
}
</style>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header class="page-header">
    <a class="back-btn" href="index.html" aria-label="戻る">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div class="mio-avatar" style="background-image: url('/mio-icon.png'); background-size: cover; background-position: center;"></div>
    <div class="header-info">
      <div class="header-name">美桜Mio AI</div>
      <div class="header-status" id="headerStatus">確認中</div>
    </div>
  </header>

  <!-- 認証状態によって切り替わるコンテンツ -->
  <div id="content" style="flex:1; display:flex; flex-direction:column; overflow:hidden;"></div>

</div>

<!-- LOGIN GATE TEMPLATE -->
<template id="gateTemplate">
  <div class="gate">
    <div class="gate-avatar"></div>
    <h1 class="gate-title">美桜Mio AI</h1>
    <div class="gate-subtitle">— Your AI assistant —</div>
    <p class="gate-message">
      AIチャットをご利用いただくには<br>
      ログインが必要です 🌸
    </p>

    <div class="gate-features">
      <div class="feature-item">
        <div class="feature-icon">💬</div>
        <div class="feature-text">
          <strong>24時間いつでも相談</strong>
          トレード・メンタル・相場のご質問なんでも
        </div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">📸</div>
        <div class="feature-text">
          <strong>チャート画像分析</strong>
          スクショを送れば、一緒に分析できます
        </div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">🌸</div>
        <div class="feature-text">
          <strong>無料でお試しいただけます</strong>
          ご登録は1分で完了します
        </div>
      </div>
    </div>

    <div class="gate-actions">
      <a href="register.html" class="gate-btn gate-btn-primary">無料で新規登録</a>
      <a href="login.html" class="gate-btn gate-btn-secondary">すでにアカウントをお持ちの方</a>
    </div>

    <div class="gate-footer">
      <a href="index.html">— back to home —</a>
    </div>
  </div>
</template>

<!-- CHAT TEMPLATE -->
<template id="chatTemplate">
  <div class="chat-wrap">
    <div class="loading" id="loading">
      <div class="loading-avatar"></div>
      <div class="loading-text">準備しています</div>
      <div class="loading-en">— Please wait —</div>
    </div>
    <iframe
      class="chat-iframe"
      id="chat-iframe"
      src="https://udify.app/chatbot/SFiiQJ4MoyrquwMY"
      allow="microphone"
      title="美桜Mio AI">
    </iframe>
  </div>
</template>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://iupkaxzesrximmfkipzd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1cGtheHplc3J4aW1tZmtpcHpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4MDM1NjIsImV4cCI6MjA5NDM3OTU2Mn0.jDZOxyLkSd3NcZgIKHJGOK9m8D561eqoQYbOUxtFYOQ';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 認証状態チェック
const { data: { session } } = await supabase.auth.getSession();

const content = document.getElementById('content');
const headerStatus = document.getElementById('headerStatus');

if (session) {
  // ログイン中:チャットを表示
  headerStatus.textContent = 'オンライン';
  const template = document.getElementById('chatTemplate');
  content.appendChild(template.content.cloneNode(true));
  
  // iframe loading 処理
  const iframe = document.getElementById('chat-iframe');
  const loading = document.getElementById('loading');
  
  iframe.addEventListener('load', () => {
    setTimeout(() => {
      loading.classList.add('hidden');
    }, 500);
  });
  
  setTimeout(() => {
    loading.classList.add('hidden');
  }, 5000);
} else {
  // 未ログイン:誘導画面を表示
  headerStatus.textContent = 'ログインしてください';
  headerStatus.style.color = 'var(--ink-soft)';
  const template = document.getElementById('gateTemplate');
  content.appendChild(template.content.cloneNode(true));
}
</script>

</body>
</html>
