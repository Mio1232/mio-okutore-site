<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>みおAI — mio億トレ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/favicon-512.png">
<!-- OGP -->
<meta property="og:type" content="website">
<meta property="og:title" content="みおAI — mio億トレ">
<meta property="og:description" content="美桜MioのAIアシスタント。トレードのご質問、いつでもお気軽に。">
<meta property="og:image" content="/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:site_name" content="mio億トレ">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="みおAI — mio億トレ">
<meta name="twitter:description" content="美桜MioのAIアシスタント。トレードのご質問、いつでもお気軽に。">
<meta name="twitter:image" content="/ogp.png">
<meta name="theme-color" content="#F7F2EA">
<style>
:root{
  --bg: #F7F2EA;
  --bg-soft: #EFE7DA;
  --bg-card: #FFFEFB;
  --ink: #3A2E2A;
  --ink-mid: #6B5D57;
  --ink-soft: #998B83;
  --rose: #C98B95;
  --rose-soft: #E8D0D2;
  --rose-deep: #B06B75;
  --sage: #9BB59C;
  --line: rgba(58,46,42,0.08);
  --line-strong: rgba(58,46,42,0.14);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html, body{ width: 100%; height: 100%; overflow: hidden; }
body{
  font-family: 'Noto Sans JP', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  position: fixed;
  inset: 0;
}
.app{
  max-width: 430px;
  margin: 0 auto;
  height: 100%;
  height: 100dvh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* HEADER */
.page-header{
  flex-shrink: 0;
  background: rgba(247,242,234,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
  padding: 14px 18px;
  display: flex; align-items: center; gap: 12px;
  z-index: 10;
}
.back-btn{
  width: 36px; height: 36px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  color: var(--ink-mid); text-decoration: none;
}
.back-btn svg{ width: 16px; height: 16px; }
.mio-avatar{
  width: 40px; height: 40px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--rose-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif JP', serif;
  font-weight: 600;
  color: var(--rose-deep);
  font-size: 18px;
}
.header-info{ flex: 1; min-width: 0; }
.header-name{
  font-family: 'Noto Serif JP', serif;
  font-size: 14px; font-weight: 600;
  letter-spacing: 0.04em;
  line-height: 1.2;
}
.header-status{
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  color: var(--sage);
  margin-top: 2px;
  display: flex; align-items: center; gap: 4px;
}
.header-status::before{
  content: '';
  width: 6px; height: 6px;
  background: var(--sage);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* IFRAME WRAPPER */
.chat-wrap{
  flex: 1;
  position: relative;
  overflow: hidden;
  background: var(--bg-card);
}
.chat-iframe{
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* LOADING */
.loading{
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  z-index: 5;
  transition: opacity 0.4s;
}
.loading.hidden{
  opacity: 0;
  pointer-events: none;
}
.loading-avatar{
  width: 64px; height: 64px;
  border-radius: 50%;
  background: var(--rose-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif JP', serif;
  font-weight: 600;
  color: var(--rose-deep);
  font-size: 28px;
  margin-bottom: 18px;
  animation: float 2s ease-in-out infinite;
}
@keyframes float{
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
.loading-text{
  font-family: 'Noto Serif JP', serif;
  font-size: 14px;
  color: var(--ink-mid);
  letter-spacing: 0.05em;
}
.loading-en{
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 11px;
  color: var(--rose-deep);
  letter-spacing: 0.16em;
  margin-top: 6px;
}
</style>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header class="page-header">
    <a class="back-btn" href="index.html" aria-label="戻る">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div class="mio-avatar">M</div>
    <div class="header-info">
      <div class="header-name">美桜Mio AI</div>
      <div class="header-status">オンライン</div>
    </div>
  </header>

  <!-- CHAT IFRAME -->
  <div class="chat-wrap">
    <div class="loading" id="loading">
      <div class="loading-avatar">M</div>
      <div class="loading-text">準備しています</div>
      <div class="loading-en">— Please wait —</div>
    </div>
    <iframe
      class="chat-iframe"
      id="chat-iframe"
      src="https://udify.app/chatbot/SFiiQJ4MoyrquwMY"
      allow="microphone"
      title="美桜Mio AI">
    </iframe>
  </div>

</div>

<script>
// iframe読み込み完了でローディング非表示
const iframe = document.getElementById('chat-iframe');
const loading = document.getElementById('loading');

iframe.addEventListener('load', () => {
  setTimeout(() => {
    loading.classList.add('hidden');
  }, 500);
});

// 念のため、5秒後にも強制的に非表示
setTimeout(() => {
  loading.classList.add('hidden');
}, 5000);
</script>

</body>
</html>
