<style>
:root{
  --bg: #F7F2EA;
  --bg-soft: #EFE7DA;
  --bg-card: #FFFEFB;
  --ink: #3A2E2A;
  --ink-mid: #6B5D57;
  --ink-soft: #998B83;
  --rose: #C98B95;
  --rose-soft: #E8D0D2;
  --rose-deep: #B06B75;
  --sage: #9BB59C;
  --line: rgba(58,46,42,0.08);
  --line-strong: rgba(58,46,42,0.14);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html, body{ width: 100%; height: 100%; overflow: hidden; }
body{
  font-family: 'Noto Sans JP', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  position: fixed;
  inset: 0;
}
.app{
  max-width: 430px;
  margin: 0 auto;
  height: 100%;
  height: 100dvh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* HEADER */
.page-header{
  flex-shrink: 0;
  background: rgba(247,242,234,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
  padding: 14px 18px;
  display: flex; align-items: center; gap: 12px;
  z-index: 10;
}
.back-btn{
  width: 36px; height: 36px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  color: var(--ink-mid); text-decoration: none;
}
.back-btn svg{ width: 16px; height: 16px; }
.mio-avatar{
  width: 40px; height: 40px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--rose-soft);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Noto Serif JP', serif;
  font-weight: 600;
  color: var(--rose-deep);
  font-size: 18px;
  overflow: hidden;
}
.header-info{ flex: 1; min-width: 0; }
.header-name{
  font-family: 'Noto Serif JP', serif;
  font-size: 14px; font-weight: 600;
  letter-spacing: 0.04em;
  line-height: 1.2;
}
.header-status{
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  color: var(--sage);
  margin-top: 2px;
  display: flex; align-items: center; gap: 4px;
}
.header-status::before{
  content: '';
  width: 6px; height: 6px;
  background: var(--sage);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* CHAT AREA */
.chat-area{
  flex: 1;
  overflow-y: auto;
  padding: 16px 16px 8px;
  background: var(--bg);
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

/* WELCOME */
.welcome-card{
  text-align: center;
  padding: 24px 16px;
  margin-bottom: 12px;
}
.welcome-avatar{
  width: 56px; height: 56px;
  border-radius: 50%;
  margin: 0 auto 12px;
  background: var(--rose-soft);
  background-image: url('/mio-icon.png');
  background-size: cover;
  background-position: center;
  box-shadow: 0 4px 12px rgba(201, 139, 149, 0.15);
}
.welcome-title{
  font-family: 'Noto Serif JP', serif;
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 4px;
}
.welcome-sub{
  font-size: 12px;
  color: var(--ink-soft);
  line-height: 1.7;
}

/* MESSAGES */
.msg{
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn{
  from{ opacity: 0; transform: translateY(6px); }
  to{ opacity: 1; transform: translateY(0); }
}
.msg-ai{ align-items: flex-start; }
.msg-user{ flex-direction: row-reverse; }

.msg-avatar{
  width: 32px; height: 32px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--rose-soft);
  background-image: url('/mio-icon.png');
  background-size: cover;
  background-position: center;
}
.msg-user .msg-avatar{ display: none; }

.msg-bubble{
  max-width: 78%;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 13.5px;
  line-height: 1.75;
  word-break: break-word;
  white-space: pre-wrap;
}
.msg-ai .msg-bubble{
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 4px 16px 16px 16px;
  color: var(--ink);
}
.msg-user .msg-bubble{
  background: var(--rose);
  color: #fff;
  border-radius: 16px 4px 16px 16px;
}
.msg-bubble img.chat-img{
  max-width: 100%;
  border-radius: 10px;
  margin-top: 6px;
  display: block;
}

/* TYPING */
.typing{ display: flex; gap: 4px; padding: 4px 0; }
.typing-dot{
  width: 7px; height: 7px;
  background: var(--ink-soft);
  border-radius: 50%;
  animation: typingBounce 1.4s ease-in-out infinite;
}
.typing-dot:nth-child(2){ animation-delay: 0.2s; }
.typing-dot:nth-child(3){ animation-delay: 0.4s; }
@keyframes typingBounce{
  0%, 60%, 100%{ transform: translateY(0); opacity: 0.4; }
  30%{ transform: translateY(-6px); opacity: 1; }
}

/* IMAGE PREVIEW */
.img-preview-wrap{
  display: none;
  padding: 8px 14px 0;
  background: rgba(247,242,234,0.95);
}
.img-preview-wrap.active{ display: flex; align-items: center; gap: 10px; }
.img-preview{
  width: 56px; height: 56px;
  border-radius: 10px;
  object-fit: cover;
  border: 1px solid var(--line-strong);
}
.img-preview-name{
  flex: 1;
  font-size: 12px;
  color: var(--ink-mid);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.img-remove-btn{
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  background: var(--bg-card);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--ink-soft);
  font-size: 14px;
  flex-shrink: 0;
}
.img-remove-btn:hover{ background: var(--rose-soft); color: var(--rose-deep); }

/* INPUT BAR */
.input-bar{
  flex-shrink: 0;
  background: rgba(247,242,234,0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  padding: 10px 14px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  display: flex;
  align-items: flex-end;
  gap: 8px;
}
.img-btn{
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--bg-card);
  border: 1px solid var(--line-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.2s;
  color: var(--ink-mid);
}
.img-btn:hover{ border-color: var(--rose); color: var(--rose-deep); }
.img-btn svg{ width: 18px; height: 18px; }
.input-field{
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--line-strong);
  border-radius: 20px;
  padding: 10px 16px;
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  resize: none;
  max-height: 100px;
  line-height: 1.5;
  outline: none;
  transition: border-color 0.2s;
}
.input-field:focus{ border-color: var(--rose); }
.input-field::placeholder{ color: var(--ink-soft); }
.send-btn{
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--rose);
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.2s;
}
.send-btn:disabled{
  background: var(--bg-soft);
  cursor: default;
}
.send-btn:not(:disabled):hover{
  background: var(--rose-deep);
  transform: scale(1.05);
}
.send-btn svg{ width: 18px; height: 18px; fill: #fff; }
.send-btn:disabled svg{ fill: var(--ink-soft); }

/* TOAST */
.toast{
  position: fixed;
  bottom: 80px;
  left: 50%; transform: translateX(-50%);
  background: var(--ink);
  color: #fff;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 12px;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show{ opacity: 1; }
.toast.error{ background: #c0392b; }

/* LOGIN GATE */
.gate{
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 32px 48px;
  text-align: center;
  background: var(--bg);
  overflow-y: auto;
}
.gate-avatar{
  width: 96px; height: 96px;
  border-radius: 50%;
  background: var(--rose-soft);
  background-image: url('/mio-icon.png');
  background-size: cover;
  background-position: center;
  margin-bottom: 24px;
  box-shadow: 0 8px 24px rgba(201, 139, 149, 0.2);
  animation: float 3s ease-in-out infinite;
}
@keyframes float{
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
.gate-title{
  font-family: 'Noto Serif JP', serif;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}
.gate-subtitle{
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 14px;
  letter-spacing: 0.12em;
  color: var(--rose-deep);
  margin-bottom: 24px;
}
.gate-message{
  font-size: 13px;
  line-height: 2;
  color: var(--ink-mid);
  margin-bottom: 32px;
  max-width: 320px;
}
.gate-features{
  width: 100%;
  max-width: 320px;
  margin-bottom: 32px;
  text-align: left;
}
.feature-item{
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 18px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 8px;
}
.feature-icon{
  width: 32px; height: 32px;
  background: var(--rose-soft);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.feature-text{
  flex: 1;
  font-size: 12px;
  color: var(--ink-mid);
  line-height: 1.6;
}
.feature-text strong{
  color: var(--ink);
  display: block;
  margin-bottom: 2px;
  font-size: 13px;
}
.gate-actions{
  width: 100%;
  max-width: 320px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.gate-btn{
  display: block;
  width: 100%;
  padding: 14px 24px;
  border-radius: 10px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-decoration: none;
  text-align: center;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
}
.gate-btn-primary{ background: var(--rose); color: #FFFFFF; }
.gate-btn-primary:hover{
  background: var(--rose-deep);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(176, 107, 117, 0.25);
}
.gate-btn-secondary{
  background: transparent;
  color: var(--ink-mid);
  border: 1px solid var(--line-strong);
}
.gate-btn-secondary:hover{
  background: var(--bg-card);
  border-color: var(--rose);
  color: var(--rose-deep);
}
.gate-footer{
  margin-top: 24px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--ink-soft);
}
.gate-footer a{ color: var(--ink-soft); text-decoration: none; }
/* === 会話履歴ドロワー === */
.header-actions{ display:flex; align-items:center; gap:6px; }
.hbtn{
  width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  border:1px solid var(--line-strong); background:var(--bg-card); border-radius:10px;
  color:var(--ink-mid); cursor:pointer; padding:0;
}
.hbtn:hover{ background:var(--rose-soft); color:var(--rose-deep); }
.hbtn svg{ width:18px; height:18px; }
.conv-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,0.35);
  opacity:0; pointer-events:none; transition:opacity .2s; z-index:60;
}
.conv-overlay.open{ opacity:1; pointer-events:auto; }
.conv-drawer{
  position:fixed; top:0; left:0; bottom:0; width:min(320px,85%);
  background:var(--bg); border-right:1px solid var(--line-strong);
  transform:translateX(-100%); transition:transform .25s; z-index:61;
  display:flex; flex-direction:column;
}
.conv-drawer.open{ transform:translateX(0); }
.conv-drawer-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px; font-family:'Noto Serif JP',serif; font-weight:700;
  border-bottom:1px solid var(--line);
}
.conv-close{ background:none; border:none; font-size:18px; color:var(--ink-soft); cursor:pointer; }
.conv-new{
  margin:12px; padding:11px; border:1px solid var(--rose); background:var(--rose-soft);
  color:var(--rose-deep); border-radius:12px; font-weight:700; cursor:pointer; font-size:14px;
}
.conv-list{ flex:1; overflow-y:auto; padding:0 8px 16px; }
.conv-item{ display:flex; align-items:center; gap:6px; padding:11px 10px; border-radius:10px; cursor:pointer; }
.conv-item:hover{ background:var(--bg-soft); }
.conv-item.active{ background:var(--rose-soft); }
.conv-item-main{ flex:1; min-width:0; }
.conv-item-title{ font-size:13px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.conv-item-date{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
.conv-del{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:13px; opacity:0; transition:opacity .15s; flex-shrink:0; }
.conv-item:hover .conv-del{ opacity:1; }
.conv-empty{ padding:20px; text-align:center; color:var(--ink-soft); font-size:13px; }
</style>
</head>

<div class="app">

    <a class="back-btn" href="index.html" aria-label="戻る">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>

<!-- CHAT UI -->

  <div class="gate">
    <div class="gate-avatar"></div>
    <h1 class="gate-title">美桜Mio AI</h1>
    <div class="gate-subtitle">— Basic &amp; Pro —</div>

<template id="chatTemplate">
  <div class="chat-area" id="chatArea">
    <div class="welcome-card">
      <div class="welcome-avatar"></div>
      <div class="welcome-title">美桜Mio AI</div>
      <div class="welcome-sub">トレードのこと、なんでも聞いてくださいね 🌸<br>チャート画像を送ると分析もできます 📸</div>
    </div>
  </div>
  <!-- 画像プレビュー -->
  <div class="img-preview-wrap" id="imgPreviewWrap">
    <img class="img-preview" id="imgPreview" src="" alt="プレビュー">
    <span class="img-preview-name" id="imgPreviewName"></span>
    <button class="img-remove-btn" id="imgRemoveBtn" aria-label="画像を削除">✕</button>
  </div>
  <!-- 入力バー -->
  <div class="input-bar">
    <input type="file" id="imgInput" accept="image/*" style="display:none">
    <button class="img-btn" id="imgBtn" aria-label="画像を添付">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </button>
    <textarea class="input-field" id="inputField" rows="1" placeholder="メッセージを入力…"></textarea>
    <button class="send-btn" id="sendBtn" disabled aria-label="送信">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</template>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://iupkaxzesrximmfkipzd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1cGtheHplc3J4aW1tZmtpcHpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4MDM1NjIsImV4cCI6MjA5NDM3OTU2Mn0.jDZOxyLkSd3NcZgIKHJGOK9m8D561eqoQYbOUxtFYOQ';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const content = document.getElementById('content');
const headerStatus = document.getElementById('headerStatus');

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 3000);
}

const { data: { session } } = await supabase.auth.getSession();

if (!session) {
  headerStatus.textContent = 'ログインしてください';
  headerStatus.style.color = 'var(--ink-soft)';
  content.appendChild(document.getElementById('gateTemplate').content.cloneNode(true));
} else {
  // ===== ログイン中 =====
  const user = session.user;

  // プランチェック：AIチャットはベーシック以上の機能
  const { data: planProfile } = await supabase
    .from('profiles').select('plan, is_admin, ai_usage_month, ai_usage_count').eq('id', user.id).single();
  const userPlan = planProfile?.plan || 'free';
  const isAdminUser = planProfile?.is_admin === true;

  if (userPlan === 'free' && !isAdminUser) {
    // 無料プラン：チャットは出さず、アップグレード案内ゲートを表示
    headerStatus.textContent = 'プランのご案内';
    content.appendChild(document.getElementById('planGateTemplate').content.cloneNode(true));
  } else {
    // ベーシック / プロ / 管理者：通常のチャットを表示
    headerStatus.textContent = 'オンライン';
    content.appendChild(document.getElementById('chatTemplate').content.cloneNode(true));

  let userName = user.email.split('@')[0];
  let userContext = '';
  let conversationId = '';
  let chatHistory = []; // {role:'user'|'assistant', content:string} の配列（直近のやり取り）
  let isLoading = false;
  let pendingImage = null; // { base64, type, name }

  const chatArea = document.getElementById('chatArea');

  // ===== AI利用回数の制限（ベーシック=月20回 / プロ・管理者=無制限）=====
  const AI_MONTHLY_LIMIT = 20;
  const isLimited = (userPlan === 'basic') && !isAdminUser;
  const currentYM = new Date().toISOString().slice(0, 7); // 'YYYY-MM'
  let aiUsageMonth = planProfile?.ai_usage_month || '';
  let aiUsageCount = (aiUsageMonth === currentYM) ? (planProfile?.ai_usage_count || 0) : 0;

  function aiRemaining() { return Math.max(0, AI_MONTHLY_LIMIT - aiUsageCount); }

  function updateLimitStatus() {
    if (isLimited) headerStatus.textContent = `今月あと${aiRemaining()}回`;
  }

  async function bumpAiUsage() {
    if (!isLimited) return;
    aiUsageCount = (aiUsageMonth === currentYM ? aiUsageCount : 0) + 1;
    aiUsageMonth = currentYM;
    try {
      await supabase.from('profiles')
        .update({ ai_usage_month: currentYM, ai_usage_count: aiUsageCount })
        .eq('id', user.id);
    } catch (e) { console.warn('[mioAI] 利用回数の更新エラー:', e); }
    updateLimitStatus();
  }

  function showLimitReached() {
    const el = document.createElement('div');
    el.className = 'msg msg-ai';
    el.innerHTML = '<div class="msg-avatar"></div><div class="msg-bubble">'
      + '今月のAIチャットは上限（月20回）に達しました🌸<br>プロプランなら<strong>回数無制限</strong>でご相談いただけます。'
      + '<div style="margin-top:10px;"><a href="plan.html" style="display:inline-block;padding:9px 16px;background:var(--rose);color:#fff;text-decoration:none;border-radius:10px;font-size:13px;font-weight:600;">プロにアップグレード →</a></div>'
      + '</div>';
    chatArea.appendChild(el);
    scrollToBottom();
  }

  updateLimitStatus();

  // ===== 会話の保存・複数チャット =====
  let currentConversationId = null;
  const AI_HISTORY_WINDOW = 40; // AIに渡す直近メッセージ数（保存は全件）

  const headerActions = document.getElementById('headerActions');
  const convDrawer = document.getElementById('convDrawer');
  const convOverlay = document.getElementById('convOverlay');
  const convList = document.getElementById('convList');
  if (headerActions) headerActions.style.display = 'flex';

  // welcome カードのHTML（新規チャット時に復元）
  const welcomeHTML = chatArea.innerHTML;

  function openDrawer() { loadConversationList(); convDrawer.classList.add('open'); convOverlay.classList.add('open'); }
  function closeDrawer() { convDrawer.classList.remove('open'); convOverlay.classList.remove('open'); }
  function fmtDate(s) { try { const d = new Date(s); return `${d.getMonth()+1}/${d.getDate()}`; } catch (e) { return ''; } }

  async function loadConversationList() {
    convList.innerHTML = '<div class="conv-empty">読み込み中…</div>';
    try {
      const { data, error } = await supabase
        .from('chat_conversations')
        .select('id, title, updated_at')
        .eq('user_id', user.id)
        .order('updated_at', { ascending: false })
        .limit(50);
      if (error) throw error;
      if (!data || data.length === 0) { convList.innerHTML = '<div class="conv-empty">まだ会話がありません</div>'; return; }
      convList.innerHTML = '';
      data.forEach(c => {
        const item = document.createElement('div');
        item.className = 'conv-item' + (c.id === currentConversationId ? ' active' : '');
        item.innerHTML = '<div class="conv-item-main"><div class="conv-item-title"></div><div class="conv-item-date">' + fmtDate(c.updated_at) + '</div></div><button class="conv-del" aria-label="削除">✕</button>';
        item.querySelector('.conv-item-title').textContent = c.title || '新しいチャット';
        item.querySelector('.conv-item-main').onclick = () => openConversation(c.id);
        item.querySelector('.conv-del').onclick = (e) => { e.stopPropagation(); deleteConversation(c.id); };
        convList.appendChild(item);
      });
    } catch (e) {
      console.error('[mioAI] 会話一覧の取得エラー:', e);
      convList.innerHTML = '<div class="conv-empty">読み込みに失敗しました</div>';
    }
  }

  async function openConversation(convId) {
    closeDrawer();
    try {
      const { data, error } = await supabase
        .from('chat_messages')
        .select('role, content')
        .eq('conversation_id', convId)
        .order('created_at', { ascending: true });
      if (error) throw error;
      currentConversationId = convId;
      chatHistory = (data || []).map(m => ({ role: m.role, content: m.content }));
      chatArea.innerHTML = '';
      chatHistory.forEach(m => addMessage(m.content, m.role === 'user'));
      scrollToBottom();
    } catch (e) {
      console.error('[mioAI] 会話の読み込みエラー:', e);
      showToast('会話の読み込みに失敗しました', true);
    }
  }

  function startNewChat() {
    closeDrawer();
    currentConversationId = null;
    chatHistory = [];
    chatArea.innerHTML = welcomeHTML;
  }

  async function deleteConversation(convId) {
    if (!confirm('この会話を削除しますか？')) return;
    try {
      await supabase.from('chat_conversations').delete().eq('id', convId);
      if (convId === currentConversationId) startNewChat();
      loadConversationList();
    } catch (e) { console.error('[mioAI] 会話の削除エラー:', e); }
  }

  async function ensureConversation(firstText) {
    if (currentConversationId) return currentConversationId;
    const title = (firstText || '新しいチャット').slice(0, 30);
    const { data, error } = await supabase
      .from('chat_conversations')
      .insert({ user_id: user.id, title })
      .select('id')
      .single();
    if (error) throw error;
    currentConversationId = data.id;
    return data.id;
  }

  async function persistTurn(userText, aiText) {
    try {
      const convId = await ensureConversation(userText);
      await supabase.from('chat_messages').insert([
        { conversation_id: convId, role: 'user', content: userText },
        { conversation_id: convId, role: 'assistant', content: aiText }
      ]);
      await supabase.from('chat_conversations').update({ updated_at: new Date().toISOString() }).eq('id', convId);
    } catch (e) { console.error('[mioAI] 会話の保存エラー:', e); }
  }

  document.getElementById('newChatBtn').onclick = startNewChat;
  document.getElementById('historyBtn').onclick = openDrawer;
  document.getElementById('convNewBtn').onclick = startNewChat;
  document.getElementById('convClose').onclick = closeDrawer;
  convOverlay.onclick = closeDrawer;

  // 起動時：最新の会話を開く（なければ新規のまま）
  (async () => {
    try {
      const { data } = await supabase
        .from('chat_conversations')
        .select('id')
        .eq('user_id', user.id)
        .order('updated_at', { ascending: false })
        .limit(1);
      if (data && data.length) await openConversation(data[0].id);
    } catch (e) { console.error('[mioAI] 初期会話の読み込みエラー:', e); }
  })();

  const inputField = document.getElementById('inputField');
  const sendBtn = document.getElementById('sendBtn');
  const imgBtn = document.getElementById('imgBtn');
  const imgInput = document.getElementById('imgInput');
  const imgPreviewWrap = document.getElementById('imgPreviewWrap');
  const imgPreview = document.getElementById('imgPreview');
  const imgPreviewName = document.getElementById('imgPreviewName');
  const imgRemoveBtn = document.getElementById('imgRemoveBtn');

  // ===== ユーザーデータ取得 =====
  try {
    const now = new Date();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];

    const [profileRes, tradesRes] = await Promise.all([
      supabase.from('profiles').select('*').eq('id', user.id).single(),
      supabase.from('trades').select('*').eq('user_id', user.id)
        .gte('trade_date', monthStart)
        .order('trade_date', { ascending: false })
    ]);

    const profile = profileRes.data;
    const trades = tradesRes.data || [];

    if (profile?.display_name) userName = profile.display_name;

    const parts = [];

    const community = profile?.community_status || '';
    const isDiscord = community === 'discord' || community.includes('discord');

    // コミュニティ参加状況（必ず最初に）
    if (isDiscord) parts.push('コミュニティ: Discord参加中');
    else if (community === 'line' || community.includes('line')) parts.push('コミュニティ: LINEメンバー');
    else parts.push('コミュニティ: 未参加');

    // FX経験
    const expMap = { beginner: '初心者', under6m: '半年未満', '6m_1y': '半年〜1年', '1y_3y': '1〜3年', '3y_plus': '3年以上' };
    if (profile?.fx_experience) parts.push('FX経験: ' + (expMap[profile.fx_experience] || profile.fx_experience));

    // ツール情報はDiscord参加者にのみ送る
    if (isDiscord) {
      const tools = profile?.tools_used || [];
      const toolMap = {
        miyabi_ea: 'みやびロジックEA',
        miyabi_3m: 'みやびEA(3ヶ月版)',
        miyabi_perm: 'みやびEA(永久版)',
        solid_edge: 'Solid Edgeインジ',
        all_system: '全システム永久版'
      };
      parts.push('使用中のツール: ' + (tools.length > 0 ? tools.map(t => toolMap[t] || t).join(', ') : '特になし(裁量のみ)'));
    }

    // 興味（Discord参加者のみEA/インジ関連を送る）
    const interests = profile?.interests || [];
    if (interests.length > 0) {
      const iMap = {
        ea: 'EA導入検討中',
        indicator: 'インジ導入検討中',
        community: 'コミュニティ参加検討中',
        learn_fx: 'FX基礎学習に興味',
        ask_ai: 'AI相談に興味',
        record_trade: 'トレード記録・分析に興味'
      };
      const filteredInterests = isDiscord
        ? interests.map(i => iMap[i] || i)
        : interests.filter(i => i !== 'ea' && i !== 'indicator').map(i => iMap[i] || i);
      if (filteredInterests.length > 0) parts.push('興味: ' + filteredInterests.join(', '));
    }

    if (trades.length > 0) {
      const totalPL = trades.reduce((s, t) => s + (t.profit_loss || 0), 0);
      const wins = trades.filter(t => (t.profit_loss || 0) > 0).length;
      const winRate = Math.round((wins / trades.length) * 100);
      const sign = totalPL >= 0 ? '+' : '';
      parts.push('今月の収支: ' + sign + totalPL.toLocaleString('ja-JP') + '円 (' + trades.length + '回取引, 勝率' + winRate + '%)');

      const byType = {};
      trades.forEach(t => {
        const type = t.trade_type || 'discretionary';
        byType[type] = (byType[type] || 0) + (t.profit_loss || 0);
      });
      const typeNames = { discretionary: '裁量', miyabi_ea: 'EA', solid_edge: 'インジ', signal: '配信', trade_stream: 'トレード配信' };
      const breakdown = Object.entries(byType)
        .filter(([, pl]) => pl !== 0)
        .map(([type, pl]) => (typeNames[type] || type) + ' ' + (pl >= 0 ? '+' : '') + pl.toLocaleString('ja-JP') + '円');
      if (breakdown.length > 0) parts.push('内訳: ' + breakdown.join(' / '));
    } else {
      parts.push('今月の収支: まだトレード記録なし');
    }

    if (profile?.target_monthly) {
      parts.push('月間目標: ' + profile.target_monthly.toLocaleString('ja-JP') + '円');
    }

    userContext = parts.join('\n');
    console.log('[mioAI] ユーザーコンテキスト読込完了:', userContext);
  } catch (e) {
    console.warn('[mioAI] コンテキスト取得エラー:', e);
  }

  // ===== 画像添付機能 =====
  imgBtn.addEventListener('click', () => imgInput.click());

  imgInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    if (file.size > 10 * 1024 * 1024) {
      showToast('画像は10MB以下にしてください', true);
      imgInput.value = '';
      return;
    }

    const reader = new FileReader();
    reader.onload = (ev) => {
      const dataUrl = ev.target.result;
      const base64 = dataUrl.split(',')[1];
      pendingImage = { base64, type: file.type, name: file.name };

      imgPreview.src = dataUrl;
      imgPreviewName.textContent = file.name;
      imgPreviewWrap.classList.add('active');
      updateSendBtn();
    };
    reader.readAsDataURL(file);
  });

  imgRemoveBtn.addEventListener('click', () => {
    pendingImage = null;
    imgInput.value = '';
    imgPreviewWrap.classList.remove('active');
    updateSendBtn();
  });

  function updateSendBtn() {
    const hasText = inputField.value.trim().length > 0;
    const hasImage = pendingImage !== null;
    sendBtn.disabled = (!hasText && !hasImage) || isLoading;
  }

  // ===== チャット機能 =====
  function scrollToBottom() {
    requestAnimationFrame(() => { chatArea.scrollTop = chatArea.scrollHeight; });
  }

  function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  function addMessage(text, isUser, imageDataUrl) {
    const el = document.createElement('div');
    el.className = 'msg ' + (isUser ? 'msg-user' : 'msg-ai');

    let bubbleContent = '';
    if (imageDataUrl) {
      bubbleContent += '<img class="chat-img" src="' + imageDataUrl + '" alt="添付画像">';
    }
    if (text) {
      bubbleContent += (imageDataUrl ? '<br>' : '') + escapeHtml(text);
    }

    el.innerHTML = '<div class="msg-avatar"></div><div class="msg-bubble">' + bubbleContent + '</div>';
    chatArea.appendChild(el);
    scrollToBottom();
  }

  function showTyping() {
    const el = document.createElement('div');
    el.className = 'msg msg-ai';
    el.id = 'typingIndicator';
    el.innerHTML = '<div class="msg-avatar"></div><div class="msg-bubble"><div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>';
    chatArea.appendChild(el);
    scrollToBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = inputField.value.trim();
    const image = pendingImage;

    if ((!text && !image) || isLoading) return;

    // ベーシックの月間上限チェック（プロ・管理者は無制限）
    if (isLimited && aiRemaining() <= 0) {
      showLimitReached();
      return;
    }

    isLoading = true;
    inputField.value = '';
    inputField.style.height = 'auto';
    sendBtn.disabled = true;

    // プレビューをクリア
    const imageDataUrl = image ? imgPreview.src : null;
    pendingImage = null;
    imgInput.value = '';
    imgPreviewWrap.classList.remove('active');

    // ユーザーメッセージ表示
    addMessage(text || '📸 チャート画像を分析してください', true, imageDataUrl);
    showTyping();

    try {
      const payload = {
        query: text || 'この画像を分析してください。チャート画像であればテクニカル分析をお願いします。',
        user_name: userName,
        user_context: userContext,
        conversation_id: conversationId,
        user_id: user.id,
        history: chatHistory.slice(-AI_HISTORY_WINDOW)
      };

      if (image) {
        payload.image_base64 = image.base64;
        payload.image_type = image.type;
      }

      const res = await fetch('/.netlify/functions/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      removeTyping();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || '通信エラー');
      }

      const data = await res.json();
      if (data.conversation_id) conversationId = data.conversation_id;
      const aiText = data.text || '申し訳ありません、応答を取得できませんでした。';
      addMessage(aiText, false);
      // 会話履歴に今回のやり取りを追加（次回以降の文脈として送る）
      const userMsgForLog = text || '（チャート画像を送信）';
      chatHistory.push({ role: 'user', content: userMsgForLog });
      chatHistory.push({ role: 'assistant', content: aiText });
      // Supabaseへ保存（複数チャット・ログ保持）
      await persistTurn(userMsgForLog, aiText);
      if (convDrawer.classList.contains('open')) loadConversationList();
      await bumpAiUsage();

    } catch (err) {
      removeTyping();
      console.error('[mioAI] 送信エラー:', err);
      addMessage('通信エラーが発生しました。もう一度お試しください。', false);
      showToast('通信エラー', true);
    } finally {
      isLoading = false;
      updateSendBtn();
    }
  }

  sendBtn.addEventListener('click', sendMessage);

  inputField.addEventListener('input', () => {
    updateSendBtn();
    inputField.style.height = 'auto';
    inputField.style.height = Math.min(inputField.scrollHeight, 100) + 'px';
  });

  // Enterは改行（送信は送信ボタンのみ）
  // ※以前はEnterで送信していたが、改行できるように送信ボタン送信へ変更

  inputField.addEventListener('focus', () => { setTimeout(scrollToBottom, 300); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', scrollToBottom);
  }
  } // end inner else（ベーシック以上のチャット表示）
}
</script>
</body>
</html>
