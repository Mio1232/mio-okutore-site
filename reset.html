<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>パスワードリセット — mio億トレ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#F7F2EA">
<style>
:root{
  --bg: #F7F2EA;
  --bg-card: #FFFEFB;
  --ink: #3A2E2A;
  --ink-mid: #6B5D57;
  --ink-soft: #998B83;
  --rose: #C98B95;
  --rose-soft: #E8D0D2;
  --rose-deep: #B06B75;
  --line: rgba(58,46,42,0.08);
  --line-strong: rgba(58,46,42,0.14);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html, body{ width: 100%; min-height: 100vh; }
body{
  font-family: 'Noto Sans JP', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.app{
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 0 24px;
}
.logo-area{
  padding: 48px 0 32px;
  text-align: center;
}
.logo-mark{
  width: 56px; height: 56px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: var(--rose-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif JP', serif;
  font-size: 24px;
  font-weight: 600;
  color: var(--rose-deep);
}
.logo-text{
  font-family: 'Cormorant Garamond', serif;
  font-size: 14px;
  letter-spacing: 0.32em;
  color: var(--rose-deep);
  text-transform: uppercase;
}
.form-area{ flex: 1; padding-top: 16px; }
.title{
  font-family: 'Noto Serif JP', serif;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}
.subtitle{
  font-size: 12px;
  color: var(--ink-mid);
  letter-spacing: 0.04em;
  margin-bottom: 32px;
  line-height: 1.8;
}
.input-group{ margin-bottom: 16px; }
.label{
  display: block;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-mid);
  margin-bottom: 6px;
  letter-spacing: 0.08em;
}
.input{
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: var(--bg-card);
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
}
.input:focus{ outline: none; border-color: var(--rose); }
.submit-btn{
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 10px;
  background: var(--rose);
  color: #FFFFFF;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.08em;
  cursor: pointer;
  margin-top: 8px;
}
.submit-btn:hover{ background: var(--rose-deep); }
.submit-btn:disabled{ opacity: 0.5; cursor: not-allowed; }
.links{
  margin-top: 24px;
  text-align: center;
  font-size: 12px;
  color: var(--ink-mid);
}
.links a{ color: var(--rose-deep); text-decoration: none; font-weight: 500; }
.message{
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 12px;
  margin-bottom: 16px;
  display: none;
  line-height: 1.6;
}
.message.success{ background: #E5EDE9; color: #2D5F4F; }
.message.error{ background: #FBEAF0; color: #993556; }
.message.show{ display: block; }
.footer{
  padding: 32px 0;
  text-align: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--ink-soft);
}
.footer a{ color: var(--ink-soft); text-decoration: none; }
</style>
</head>
<body>

<div class="app">

  <div class="logo-area">
    <div class="logo-mark">m</div>
    <div class="logo-text">mio okutore</div>
  </div>

  <div class="form-area">
    <h1 class="title">パスワードリセット</h1>
    <p class="subtitle">ご登録のメールアドレスに、<br>パスワード再設定用のリンクをお送りします</p>

    <div class="message" id="message"></div>

    <form id="resetForm">
      <div class="input-group">
        <label class="label">メールアドレス</label>
        <input type="email" id="email" class="input" placeholder="your@email.com" required>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">リセットメールを送信</button>
    </form>

    <div class="links">
      <a href="login.html">ログイン画面に戻る</a>
    </div>
  </div>

  <div class="footer">
    <a href="index.html">— back to home —</a>
  </div>

</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://iupkaxzesrximmfkipzd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1cGtheHplc3J4aW1tZmtpcHpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4MDM1NjIsImV4cCI6MjA5NDM3OTU2Mn0.jDZOxyLkSd3NcZgIKHJGOK9m8D561eqoQYbOUxtFYOQ';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const form = document.getElementById('resetForm');
const message = document.getElementById('message');
const submitBtn = document.getElementById('submitBtn');

function showMessage(text, type = 'error') {
  message.innerHTML = text;
  message.className = 'message show ' + type;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();

  submitBtn.disabled = true;
  submitBtn.textContent = '送信中...';

  try {
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/update-password.html'
    });

    if (error) {
      showMessage('送信に失敗しました', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'リセットメールを送信';
      return;
    }

    showMessage('リセット用メールをお送りしました🌸<br>受信トレイをご確認ください', 'success');
    submitBtn.textContent = '送信完了';

  } catch (err) {
    showMessage('エラーが発生しました', 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = 'リセットメールを送信';
  }
});
</script>

</body>
</html>
