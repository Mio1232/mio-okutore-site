<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>パスワード再設定 — mio億トレ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#F7F2EA">
<style>
:root{
  --bg: #F7F2EA;
  --bg-soft: #EFE7DA;
  --bg-card: #FFFEFB;
  --ink: #3A2E2A;
  --ink-mid: #6B5D57;
  --ink-soft: #998B83;
  --rose: #C98B95;
  --rose-soft: #E8D0D2;
  --rose-deep: #B06B75;
  --sage: #9BB59C;
  --line: rgba(58,46,42,0.08);
  --line-strong: rgba(58,46,42,0.14);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html, body{ width: 100%; min-height: 100vh; }
body{
  font-family: 'Noto Sans JP', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.app{
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 0 24px;
}
.logo-area{ padding: 48px 0 32px; text-align: center; }
.logo-mark{
  width: 56px; height: 56px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: var(--rose-soft);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Noto Serif JP', serif;
  font-size: 24px; font-weight: 600; color: var(--rose-deep);
}
.logo-text{
  font-family: 'Cormorant Garamond', serif;
  font-size: 14px; letter-spacing: 0.32em; color: var(--rose-deep); text-transform: uppercase;
}
.form-area{ flex: 1; display: flex; flex-direction: column; padding-top: 16px; }
.title{
  font-family: 'Noto Serif JP', serif;
  font-size: 22px; font-weight: 500; letter-spacing: 0.04em; margin-bottom: 4px;
}
.subtitle{ font-size: 12px; color: var(--ink-mid); letter-spacing: 0.04em; margin-bottom: 32px; }
.input-group{ margin-bottom: 16px; }
.label{
  display: block; font-size: 11px; font-weight: 500; color: var(--ink-mid);
  margin-bottom: 6px; letter-spacing: 0.08em;
}
.input{
  width: 100%; padding: 14px 16px;
  border: 1px solid var(--line-strong); border-radius: 10px;
  background: var(--bg-card); font-family: inherit; font-size: 14px; color: var(--ink);
  transition: border-color 0.2s;
}
.input:focus{ outline: none; border-color: var(--rose); }
.submit-btn{
  width: 100%; padding: 16px; border: none; border-radius: 10px;
  background: var(--rose); color: #FFFFFF; font-family: inherit;
  font-size: 14px; font-weight: 600; letter-spacing: 0.08em; cursor: pointer;
  margin-top: 8px; transition: background 0.2s;
}
.submit-btn:hover{ background: var(--rose-deep); }
.submit-btn:disabled{ opacity: 0.5; cursor: not-allowed; }
.links{ margin-top: 24px; text-align: center; font-size: 12px; color: var(--ink-mid); }
.links a{ color: var(--rose-deep); text-decoration: none; font-weight: 500; }
.links a:hover{ text-decoration: underline; }
.message{
  padding: 12px 16px; border-radius: 8px; font-size: 12px; margin-bottom: 16px; display: none;
}
.message.success{ background: #E5EDE9; color: #2D5F4F; }
.message.error{ background: #FBEAF0; color: #993556; }
.message.show{ display: block; }
.hint{ font-size: 11px; color: var(--ink-soft); margin-top: 6px; }
.footer{
  padding: 32px 0; text-align: center;
  font-family: 'Cormorant Garamond', serif; font-size: 11px; letter-spacing: 0.16em; color: var(--ink-soft);
}
.footer a{ color: var(--ink-soft); text-decoration: none; }
</style>
</head>
<body>

<div class="app">

  <div class="logo-area">
    <div class="logo-mark">m</div>
    <div class="logo-text">mio okutore</div>
  </div>

  <div class="form-area">
    <h1 class="title">新しいパスワード</h1>
    <p class="subtitle">新しいパスワードを入力してください</p>

    <div class="message" id="message"></div>

    <form id="resetForm">
      <div class="input-group">
        <label class="label">新しいパスワード</label>
        <input type="password" id="password" class="input" placeholder="••••••••" required autocomplete="new-password">
        <div class="hint">6文字以上で入力してください</div>
      </div>

      <div class="input-group">
        <label class="label">新しいパスワード（確認）</label>
        <input type="password" id="password2" class="input" placeholder="••••••••" required autocomplete="new-password">
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">パスワードを変更する</button>
    </form>

    <div class="links">
      <a href="login.html">ログインページへ戻る</a>
    </div>
  </div>

  <div class="footer">
    <a href="index.html">— back to home —</a>
  </div>

</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://iupkaxzesrximmfkipzd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1cGtheHplc3J4aW1tZmtpcHpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4MDM1NjIsImV4cCI6MjA5NDM3OTU2Mn0.jDZOxyLkSd3NcZgIKHJGOK9m8D561eqoQYbOUxtFYOQ';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const form = document.getElementById('resetForm');
const message = document.getElementById('message');
const submitBtn = document.getElementById('submitBtn');

function showMessage(text, type = 'error') {
  message.textContent = text;
  message.className = 'message show ' + type;
}

// リンクのエラー(期限切れ・無効)を検出
function checkLinkError() {
  const hash = window.location.hash || '';
  const search = window.location.search || '';
  const blob = (hash + '&' + search).toLowerCase();
  if (blob.includes('error')) {
    let desc = '';
    const m = (hash + '&' + search).match(/error_description=([^&]+)/);
    if (m) { try { desc = decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch(e){ desc = m[1]; } }
    showMessage('再設定リンクが無効か、有効期限が切れています。お手数ですが、もう一度パスワード再設定メールを送信してください。', 'error');
    form.style.display = 'none';
    return true;
  }
  return false;
}
checkLinkError();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;

  if (password.length < 6) {
    showMessage('パスワードは6文字以上で入力してください', 'error');
    return;
  }
  if (password !== password2) {
    showMessage('確認用パスワードが一致しません', 'error');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = '変更中...';
  message.classList.remove('show');

  try {
    const { error } = await supabase.auth.updateUser({ password });

    if (error) {
      let errMsg = 'パスワードの変更に失敗しました';
      if (error.message && (error.message.includes('session') || error.message.includes('Auth session'))) {
        errMsg = '再設定リンクの有効期限が切れているようです。もう一度パスワード再設定メールを送信してください。';
      } else if (error.message && error.message.includes('should be different')) {
        errMsg = '以前と同じパスワードは使用できません。別のパスワードを入力してください。';
      }
      showMessage(errMsg, 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'パスワードを変更する';
      return;
    }

    showMessage('パスワードを変更しました🌸 ログインページに移動します...', 'success');
    // 念のためサインアウトして、新しいパスワードでログインし直してもらう
    setTimeout(async () => {
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    }, 1500);

  } catch (err) {
    showMessage('エラーが発生しました。もう一度お試しください', 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = 'パスワードを変更する';
  }
});
</script>

</body>
</html>
