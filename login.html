<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ログイン — mio億トレ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png">
<meta name="theme-color" content="#F7F2EA">
<style>
:root{
  --bg: #F7F2EA;
  --bg-soft: #EFE7DA;
  --bg-card: #FFFEFB;
  --ink: #3A2E2A;
  --ink-mid: #6B5D57;
  --ink-soft: #998B83;
  --rose: #C98B95;
  --rose-soft: #E8D0D2;
  --rose-deep: #B06B75;
  --sage: #9BB59C;
  --line: rgba(58,46,42,0.08);
  --line-strong: rgba(58,46,42,0.14);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html, body{ width: 100%; min-height: 100vh; }
body{
  font-family: 'Noto Sans JP', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.app{
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 0 24px;
}

/* HEADER LOGO */
.logo-area{
  padding: 48px 0 32px;
  text-align: center;
}
.logo-mark{
  width: 56px; height: 56px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: var(--rose-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif JP', serif;
  font-size: 24px;
  font-weight: 600;
  color: var(--rose-deep);
}
.logo-text{
  font-family: 'Cormorant Garamond', serif;
  font-size: 14px;
  letter-spacing: 0.32em;
  color: var(--rose-deep);
  text-transform: uppercase;
}

/* FORM */
.form-area{
  flex: 1;
  display: flex;
  flex-direction: column;
  padding-top: 16px;
}
.title{
  font-family: 'Noto Serif JP', serif;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}
.subtitle{
  font-size: 12px;
  color: var(--ink-mid);
  letter-spacing: 0.04em;
  margin-bottom: 32px;
}

.input-group{
  margin-bottom: 16px;
}
.label{
  display: block;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-mid);
  margin-bottom: 6px;
  letter-spacing: 0.08em;
}
.input{
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: var(--bg-card);
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  transition: border-color 0.2s;
}
.input:focus{
  outline: none;
  border-color: var(--rose);
}

.submit-btn{
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 10px;
  background: var(--rose);
  color: #FFFFFF;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.08em;
  cursor: pointer;
  margin-top: 8px;
  transition: background 0.2s;
}
.submit-btn:hover{ background: var(--rose-deep); }
.submit-btn:disabled{
  opacity: 0.5;
  cursor: not-allowed;
}

.links{
  margin-top: 24px;
  text-align: center;
  font-size: 12px;
  color: var(--ink-mid);
}
.links a{
  color: var(--rose-deep);
  text-decoration: none;
  font-weight: 500;
}
.links a:hover{ text-decoration: underline; }
.divider{
  margin: 16px 0;
  text-align: center;
  position: relative;
  color: var(--ink-soft);
  font-size: 11px;
  letter-spacing: 0.16em;
}
.divider::before{
  content: '';
  position: absolute;
  left: 0; right: 0; top: 50%;
  height: 1px;
  background: var(--line);
  z-index: 0;
}
.divider span{
  background: var(--bg);
  padding: 0 12px;
  position: relative;
  z-index: 1;
}

/* MESSAGE */
.message{
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 12px;
  margin-bottom: 16px;
  display: none;
}
.message.success{
  background: #E5EDE9;
  color: #2D5F4F;
}
.message.error{
  background: #FBEAF0;
  color: #993556;
}
.message.show{ display: block; }

/* FOOTER */
.footer{
  padding: 32px 0;
  text-align: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--ink-soft);
}
.footer a{
  color: var(--ink-soft);
  text-decoration: none;
}
</style>
</head>
<body>

<div class="app">

  <div class="logo-area">
    <div class="logo-mark">m</div>
    <div class="logo-text">mio okutore</div>
  </div>

  <div class="form-area">
    <h1 class="title">おかえりなさい</h1>
    <p class="subtitle">メールアドレスとパスワードでログイン</p>

    <div class="message" id="message"></div>

    <form id="loginForm">
      <div class="input-group">
        <label class="label">メールアドレス</label>
        <input type="email" id="email" class="input" placeholder="your@email.com" required autocomplete="email">
      </div>

      <div class="input-group">
        <label class="label">パスワード</label>
        <input type="password" id="password" class="input" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">ログイン</button>
    </form>

    <div class="links">
      <a href="reset.html">パスワードを忘れた方</a>
    </div>

    <div class="divider"><span>OR</span></div>

    <div class="links">
      アカウントをお持ちでない方は<br>
      <a href="register.html">新規登録はこちら</a>
    </div>
  </div>

  <div class="footer">
    <a href="index.html">— back to home —</a>
  </div>

</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://iupkaxzesrximmfkipzd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1cGtheHplc3J4aW1tZmtpcHpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4MDM1NjIsImV4cCI6MjA5NDM3OTU2Mn0.jDZOxyLkSd3NcZgIKHJGOK9m8D561eqoQYbOUxtFYOQ';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// パスワード再設定リンクから来た場合は、新パスワード設定ページへ転送（自動ログインさせない）
if (window.location.hash && window.location.hash.includes('type=recovery')) {
  window.location.replace('update-password.html' + window.location.hash);
} else {
  // すでにログインしている場合はダッシュボードへ
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    window.location.href = 'dashboard.html';
  }
}

const form = document.getElementById('loginForm');
const message = document.getElementById('message');
const submitBtn = document.getElementById('submitBtn');

function showMessage(text, type = 'error') {
  message.textContent = text;
  message.className = 'message show ' + type;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  submitBtn.disabled = true;
  submitBtn.textContent = 'ログイン中...';
  message.classList.remove('show');

  try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      let errMsg = 'ログインに失敗しました';
      if (error.message.includes('Invalid login credentials')) {
        errMsg = 'メールアドレスまたはパスワードが正しくありません';
      } else if (error.message.includes('Email not confirmed')) {
        errMsg = 'メールアドレスの認証がまだ完了していません。受信メールをご確認ください';
      }
      showMessage(errMsg, 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'ログイン';
      return;
    }

    showMessage('ログイン成功、移動しています...', 'success');
    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 800);

  } catch (err) {
    showMessage('エラーが発生しました', 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = 'ログイン';
  }
});
</script>

</body>
</html>
